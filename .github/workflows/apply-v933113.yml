name: Apply v9.33.113 patch
# One-shot: applies tmp/patch_v933113.py, proves the result with the full
# verifier, then commits and pushes it. The push uses GITHUB_TOKEN, which
# triggers no workflow - nova-apk.yml is dispatched by hand afterwards, so
# exactly one APK build runs for this version.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NOVA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the patch
        run: python3 tmp/patch_v933113.py .
      - name: Prove it with the full verifier
        run: python3 tmp/verify_patches.py .
      - name: Commit and push
        run: |
          git config user.name "NOVA release bot"
          git config user.email "rautshivamxyz@gmail.com"
          git add -A
          git commit -m 'v9.33.113 "Setting the exam date again does not add a second exam": v9.16.3 connected exam_date.txt to exams.json with Exams.add, which only appends. Correcting the date - the ordinary thing to do when a date moves - therefore left the old row in the list for ever, and "Exam in 102 days (15 Feb); Exam in 135 days (20 Mar)" went into the prompt of every turn: two answers to one question, and the model picked one. The Exams screen showed a row the user never added, and the chat countdown disagreed with both. Exams.set replaces the row of that name and the chat path uses it; the Exams screen still adds. The v9.16.3 verify check now pins the intent (the chat exam reaches the store) rather than the verb. Pinned by four new verify checks.'
          git push
