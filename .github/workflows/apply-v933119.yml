name: Apply v9.33.119 patch
# One-shot: applies tmp/patch_v933119.py, proves the result with the full
# verifier, then commits and pushes it. The push uses GITHUB_TOKEN, which
# triggers no workflow - nova-apk.yml is dispatched by hand afterwards, so
# exactly one APK build runs for this version.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NOVA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the patch
        run: python3 tmp/patch_v933119.py .
      - name: Prove it with the full verifier
        run: python3 tmp/verify_patches.py .
      - name: Commit and push
        run: |
          git config user.name "NOVA release bot"
          git config user.email "rautshivamxyz@gmail.com"
          git add -A
          git commit -m 'v9.33.119 "A store that could not be read is not an empty store": every store in NOVA parses its file defensively, so a file it cannot read comes back as "nothing there". That is the right answer for a screen that only displays. It is the wrong answer for a store that WRITES BACK what it just read, and these all do: ReminderStore.add, ReminderStore.remove, Exams.add, Exams.set, Planner.setMinutes, Planner.saveTopics and the doubt journal. Give any of them an unreadable file and the load hands it an empty list, the change is added to that emptiness, and the save writes the result over the whole file - the user adds ONE reminder and loses every other reminder they had, and merely letting a one-shot reminder ring wipes the list from a broadcast receiver. The reminder store own comment calls a reminder "the one thing here the user cannot re-derive": v9.33.96 hardened it against a bad ROW and left the bad FILE free to do exactly that, and v9.33.112 fixed this shape once in the recipe library without sweeping for the others. One rule, one home now: NcieFiles.readOrNull answers empty text for "not there yet" and null for "there and unreadable", every store gets an OrNull loader that can say it failed, and every read-modify-write refuses to save over a load that failed and answers its caller - the reminder path tells the user the reminder will ring but is not saved. The readers are unchanged, because showing nothing is still the right thing to do with a file that cannot be read. Pinned by eight new verify checks and a new NcieReadOrNullTest that pins the two answers.'
          git push
