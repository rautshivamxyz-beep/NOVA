name: apply-v570
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tmp/apply_v570.py
      - name: Commit applied patch
        run: |
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git add android/app/src/main/java/org/nova/NovaEngine.kt android/app/src/main/java/org/nova/Settings.kt android/app/src/main/java/org/nova/SettingsActivity.kt
          git commit -m "v5.7.0: speculative decoding toggle (applied by CI)"
          git push
