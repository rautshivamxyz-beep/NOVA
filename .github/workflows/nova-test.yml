name: NOVA Tests
on:
  workflow_dispatch:

concurrency:
  group: nova-test
  cancel-in-progress: true

jobs:
  logic:
    name: Logic tests (source verification)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout NOVA
        uses: actions/checkout@v4

      - name: Verify source integrity
        run: python3 tmp/verify_patches.py .

  emulator:
    name: Emulator smoke test (launch + calculator)
    runs-on: macos-latest
    steps:
      - name: Checkout NOVA
        uses: actions/checkout@v4

      - name: Verify source integrity
        run: python3 tmp/verify_patches.py .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build arm64 APK for the emulator
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace -PNOVA_ABIS=arm64-v8a

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64-v8a
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            python3 tmp/smoke_test.py android/app/build/outputs/apk/release/app-release.apk

      - name: Upload screenshot (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshots
          path: |
            *.png
          if-no-files-found: ignore