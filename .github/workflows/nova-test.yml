name: NOVA Tests
on:
  workflow_dispatch:

concurrency:
  group: nova-test
  cancel-in-progress: true

jobs:
  logic:
    name: Logic tests (source verification)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout NOVA
        uses: actions/checkout@v4

      - name: Verify source integrity
        run: python3 tmp/verify_patches.py .

