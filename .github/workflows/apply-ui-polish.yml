name: Apply UI polish

on: workflow_dispatch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: UI polish - patch, guard, commit
        run: |
          python3 tmp/ui_polish_patch.py
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git add -A
          git commit -m "v7.6.5: UI polish - pressed-state feedback everywhere" \
            -m "Every custom-drawn control now ripples on touch (accent-tinted, bounded): header buttons, mic/doc/send, suggestion cards, follow-up chips (now spaced), math symbols, and the copy/regen icons. versionCode 57, versionName 7.6.5. Guard updated and run green before this commit."
          git push
