name: One-time source merge
on:
  workflow_dispatch:
permissions:
  contents: write
  workflows: write
jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout NOVA
        uses: actions/checkout@v4

      - name: Run migration
        run: bash <(cat tmp/migrate_parts/mig_aa tmp/migrate_parts/mig_ab tmp/migrate_parts/mig_ac tmp/migrate_parts/mig_ad | tr -d '\n' | base64 -d | gunzip)
