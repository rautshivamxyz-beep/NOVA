name: Apply v9.33.120 patch
# One-shot: applies tmp/patch_v933120.py, proves the result with the full
# verifier, then commits and pushes it. The push uses GITHUB_TOKEN, which
# triggers no workflow - nova-apk.yml is dispatched by hand afterwards, so
# exactly one APK build runs for this version.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NOVA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the patch
        run: python3 tmp/patch_v933120.py .
      - name: Prove it with the full verifier
        run: python3 tmp/verify_patches.py .
      - name: Commit and push
        run: |
          git config user.name "NOVA release bot"
          git config user.email "rautshivamxyz@gmail.com"
          git add -A
          git commit -m 'v9.33.120 "One exam date, one store": the chat countdown read filesDir/exam_date.txt, and nothing but the chat command ever wrote that file - the Exams screen writes exams.json, the date picker writes exams.json, and the model exam line reads exams.json. So the two halves of the app disagreed about whether an exam existed at all: a date set on the Exams screen was invisible to "days to my exam", "plan my revision" and the exam countdown, which answered "Set your exam date first" while the screen was showing the exam and the prompt of every turn was telling the model about it; and an exam cleared on the screen left the chat counting down to an exam that no longer existed, for as long as that file survived. v9.33.113 fixed the WRITE half - the chat now stores its date in exams.json too - and left the read half on its own file, and v9.33.118 fixed which days count as upcoming in one of the two places that asked. One store now: Exams. One selection rule: Exams.nearest - the exam whose day is today or later, nearest first, which is the exam the screen lists first and the one the prompt carries, and with nothing upcoming the most recent past exam rather than null, so the chat says the exam is today or already past instead of asking for a date the screen is still showing. "Exam done" removes that exam from the store, not just from a file nobody else reads, and it says so when the list could not be read. The chat reply after setting a date counts down to the date just stored, not to whichever exam the store answers with now. The legacy file is still read, but only when exams.json has nothing to say, so an install that set its date before this release keeps its countdown. Pinned by six new verify checks, three updated ones, and a new ExamsNearestTest that pins which exam is "my exam" when there are several.'
          git push
