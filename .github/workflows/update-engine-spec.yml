name: Update llama.cpp engine (v8.0 live sampling)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout NOVA
        uses: actions/checkout@v4
      - name: Checkout llama.cpp (pinned to the engine NOVA runs)
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 6e60f35608ec6918b44a9839c0c433687165f086
          path: llama.cpp
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "cmake;3.31.6" "ndk;29.0.13113456" > /dev/null
      - name: Allow Android 11 (minSdk 30)
        run: |
          sed -i 's/minSdk = 33/minSdk = 30/' llama.cpp/examples/llama.android/lib/build.gradle.kts
      - name: Patch engine threading (v5.3 big-core threads)
        run: |
          python3 tmp/patch_engine53.py llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -n "NOVA v5.3" llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
      - name: Patch engine speculative decoding (v5.7.0)
        run: |
          python3 tmp/patch_engine55.py llama.cpp/examples/llama.android
          grep -c "NOVA v5.7.0" llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
      - name: Patch engine v6.1.0 (anti-repetition + KV cache)
        run: |
          python3 tmp/patch_engine56.py llama.cpp/examples/llama.android
          grep -c "NOVA v6.1.0" llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
      - name: Patch engine v6.2 (flash attention + resettable system prompt)
        run: |
          python3 tmp/patch_engine62.py llama.cpp
          grep -n "NOVA v6.2" llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
      - name: Patch engine v7.2 (G85 thread tuning + generation-stop fix)
        run: |
          python3 tmp/patch_engine70.py llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -n "NOVA v7.2" llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp | head -3
      - name: Patch engine v7.5 (all-core prefill threads)
        run: |
          python3 tmp/patch_engine71.py llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -n "NOVA v7.5" llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
      - name: Patch engine v8.0 (live sampling setters)
        run: |
          python3 tmp/patch_engine80.py llama.cpp/examples/llama.android
          grep -n "NOVA v8.0" llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp | head -3
      - name: Build the binding
        working-directory: llama.cpp/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew :lib:assembleRelease --no-daemon
      - name: Commit new engine into NOVA
        run: |
          set -e
          cp llama.cpp/examples/llama.android/lib/build/outputs/aar/*.aar android/app/libs/llama-release.aar
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git add android/app/libs/llama-release.aar android/app/src/main/java/org/nova/ android/app/build.gradle
          git commit -m "engine: v8.0.0 live sampling - setSampling setters for temp/top_p/top_k/min_p/repeat_penalty (llama.cpp 6e60f35 + v5.3..v8.0 patches)"
          git push
