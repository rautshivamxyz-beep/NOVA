name: Build NOVA APK
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout NOVA
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build NOVA release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Show APK
        run: ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload NOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-APK
          path: android/app/build/outputs/apk/release/app-release.apk
