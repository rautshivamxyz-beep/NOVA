name: Build NOVA APK
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: nova-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout NOVA
        uses: actions/checkout@v4

      - name: Assemble CI files and apply patch chain
        run: bash <(cat tmp/ci_parts/prep_aa | tr -d '\n' | base64 -d | gunzip)

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build NOVA release APK (arm64)
        working-directory: android
        env:
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify signature + build universal APK
        env:
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
        run: bash <(cat tmp/ci_parts/fin_aa | tr -d '\n' | base64 -d | gunzip)

      - name: Upload NOVA APK (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-APK
          path: ${{ runner.temp }}/apk-arm64/app-release.apk

      - name: Upload NOVA universal APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-APK-Universal
          path: android/app/build/outputs/apk/release/app-release.apk
