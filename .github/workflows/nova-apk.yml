name: Build NOVA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout NOVA
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Download Llama 3.2 1B GGUF
        run: |
          mkdir -p android/app/src/main/assets
          curl -L --fail --retry 3 \
            "https://huggingface.co/hugging-quants/Llama-3.2-1B-Instruct-Q4_K_M-GGUF/resolve/main/llama-3.2-1b-instruct-q4_k_m.gguf?download=true" \
            -o android/app/src/main/assets/llama-3.2-1b-instruct-q4_k_m.gguf

          ls -lh android/app/src/main/assets/llama-3.2-1b-instruct-q4_k_m.gguf

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build NOVA APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload NOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
