name: NOVA Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build NOVA APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout NOVA
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Verify environment
        working-directory: android
        run: |
          echo "===== JAVA ====="
          java -version

          echo
          echo "===== GRADLE ====="
          ./gradlew --version

          echo
          echo "===== AAPT2 OVERRIDE CHECK ====="
          if grep -q '^android.aapt2FromMavenOverride=' gradle.properties 2>/dev/null; then
            echo "ERROR: AAPT2 override still exists"
            exit 1
          else
            echo "OK: No custom AAPT2 override"
          fi

      - name: Build NOVA Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show APK
        run: |
          echo "===== APK ====="
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload NOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
