name: Build NOVA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;25.2.9519653"

      - name: Fix Buildozer legacy sdkmanager
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"

          mv "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" \
             "$ANDROID_SDK_ROOT/tools/bin/sdkmanager.old" 2>/dev/null || true

          cat > "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" <<'SCRIPT'
          #!/bin/bash
          exec "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" "$@"
          SCRIPT

          chmod +x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-APK
          path: bin/*.apk
