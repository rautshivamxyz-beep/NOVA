name: Apply NOVA v9.33.155

# One-shot applier for the v9.33.155 release ("One gate, one place").
#
# Same proven mechanism as apply-933153.yml: main receives exactly the tree that
# was verified before the push, and the applier deletes itself in the commit it
# pushes, so main is left holding nothing but the release. The release travels
# as an exact-anchor edit script rather than a mailable patch because the change
# is five discrete replacements: each anchor must appear exactly once or the job
# stops before anything is committed.
#
# This release exists because main was RED: PR #113 moved the fetch gate into
# EvidencePipeline and left four assertions in tmp/verify_patches.py pointing at
# the matcher it deleted, so "Verify source integrity" failed and no release
# could be built from main at all.
#
# The push uses the workflow's own GITHUB_TOKEN, which does not trigger other
# workflows: nova-apk.yml is dispatched by hand afterwards.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Refuse if this version is already released
        run: |
          if git rev-parse -q --verify "refs/tags/v9.33.155" >/dev/null; then
            echo "FATAL: v9.33.155 is already released - nothing to apply."
            exit 1
          fi
          echo "v9.33.155 is not yet released - safe to apply."

      - name: Refuse if this release was already applied
        run: |
          echo "main is at $(git rev-parse --short HEAD)"
          if grep -q "v9.33.155: the fetch gate has exactly one home" tmp/verify_patches.py 2>/dev/null; then
            echo "FATAL: the v9.33.155 checks are already there - the release was applied before."
            exit 1
          fi
          echo "main has no v9.33.155 checks yet - clean to apply."

      - name: Apply the release
        run: |
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          python3 - <<'PY'
          import os
          import sys

          def edit(path, pairs):
              p = os.path.join(".", path)
              s = open(p, encoding="utf-8").read()
              for old, new in pairs:
                  n = s.count(old)
                  if n != 1:
                      sys.exit("FATAL: anchor appears %d times in %s: %r" % (n, path, old[:70]))
                  s = s.replace(old, new, 1)
              open(p, "w", encoding="utf-8").write(s)
              print("edited " + path)

          # 1. the version
          edit("android/app/build.gradle", [(
              "        versionCode 322\n        versionName '9.33.154'",
              "        versionCode 323\n        versionName '9.33.155'",
          )])

          # 2. the test the 2-whole-word rule never had
          edit("android/app/src/test/java/org/nova/ncie/verify/EvidencePipelineTest.kt", [(
              "    @Test fun blankResearchInputsFailClosed() {",
              """    @Test fun wholeWordHitCountIsHonoured() {
                  // v9.33.155: the 2-whole-word rule is a parameter, not a magic number
                  // buried in the caller - raising it must actually refuse a page that
                  // covers only two of the query's words.
                  val query = "quantum entanglement experiment"
                  val source = "Quantum entanglement is mentioned once in this long page " +
                      "about mountains, rivers, cities, food, music, films and travel."
                  assertFalse(EvidencePipeline.acceptsFetchedSource(
                      query, source, minCoverage = 1.0, minWholeWordHits = 99
                  ))
                  assertTrue(EvidencePipeline.acceptsFetchedSource(query, source))
              }

              @Test fun blankResearchInputsFailClosed() {""",
          )])

          # 3. the four assertions that followed the gate to its new home
          edit("tmp/verify_patches.py", [
              (
                  '# ---- v9.20.0 "Search fix": the fetch gate + honest failures ----\n'
                  'check("v9.20.0: the fetch gate accepts a 2-keyword match (OnlineFetch)",\n'
                  '      of_.count("fun hits(") == 1 and of_.count("hits(q, wiki.second) >= 2") == 1 and\n'
                  '      of_.count("Coverage.ratio(q,") == 2)',
                  '# ---- v9.20.0 "Search fix": the fetch gate + honest failures ----\n'
                  '# v9.33.155: the fetch acceptance rule no longer lives inside OnlineFetch -\n'
                  '# PR #113 moved it to org.nova.ncie.verify.EvidencePipeline so research and\n'
                  '# durable memory share one decision. The rule itself (2 whole-word hits, or\n'
                  '# 15% coverage) is unchanged; these checks follow it to its new home.\n'
                  '_evp = load("ncie/verify/EvidencePipeline.kt")\n'
                  'check("v9.20.0: the fetch gate accepts a 2-keyword match (OnlineFetch)",\n'
                  '      of_.count("EvidencePipeline.acceptsFetchedSource(") == 2 and\n'
                  '      _evp.count("minWholeWordHits: Int = 2") == 1)',
              ),
              (
                  'check("v9.16.2: online fetch tries several Wikipedia hits + looser gate (OnlineFetch)",\n'
                  '      of_.count("srlimit=3") == 1 and of_.count("Coverage.ratio(q,") == 2)',
                  'check("v9.16.2: online fetch tries several Wikipedia hits + looser gate (OnlineFetch)",\n'
                  '      of_.count("srlimit=3") == 1 and of_.count("EvidencePipeline.acceptsFetchedSource(") == 2)',
              ),
              (
                  'check("v8.4.0: the fetcher gates with Coverage and sends keywords only",\n'
                  '      of_.count("Coverage.ratio") == 2 and of_.count("wikipedia.org") == 4)',
                  'check("v8.4.0: the fetcher gates with Coverage and sends keywords only",\n'
                  '      _evp.count("Coverage.ratio(query, sourceText)") == 1 and\n'
                  '      of_.count("wikipedia.org") == 4)',
              ),
              (
                  'check("v9.33.76: the search acceptance gate uses every-script terms",\n'
                  '      "Tokens.contentWords(q).distinct()" in nof)',
                  'check("v9.33.76: the search acceptance gate uses every-script terms",\n'
                  '      "Tokens.contentWords(query).distinct()" in _evp)',
              ),
              (
                  'print("")\nif fails:',
                  '# ---- v9.33.155 "One gate, one place" ----\n'
                  '# PR #113 replaced the fetch matcher that used to live in OnlineFetch with\n'
                  '# EvidencePipeline.acceptsFetchedSource. The four checks above were rewritten\n'
                  '# to follow the rule; these pin the shape of the move so it cannot drift back\n'
                  '# into a second, private copy of the gate.\n'
                  'check("v9.33.155: the fetch gate has exactly one home (EvidencePipeline)",\n'
                  '      _evp.count("fun acceptsFetchedSource(") == 1 and\n'
                  '      of_.count("fun hits(") == 0 and\n'
                  '      of_.count("Coverage.ratio") == 0)\n'
                  'check("v9.33.155: the gate reads every-script content words, not ASCII length",\n'
                  '      "Tokens.contentWords(query).distinct()" in _evp and\n'
                  '      "Tokens.norm(sourceText)" in _evp)\n'
                  'check("v9.33.155: the shared gate is pinned by unit tests",\n'
                  '      "acceptsFetchedSource" in load_test("verify/EvidencePipelineTest.kt") and\n'
                  '      "minWholeWordHits" in load_test("verify/EvidencePipelineTest.kt"))\n'
                  'check("v9.33.155: version is at least 9.33.155 (323)",\n'
                  '      version_at_least("9.33.155", 323))\n'
                  '\nprint("")\nif fails:',
              ),
          ])
          print("applied v9.33.155")
          PY
          git add -A
          git commit -q -F- <<'MSG'
          v9.33.155 "One gate, one place"

          PR #113 merged the fetch gate into EvidencePipeline.acceptsFetchedSource and
          deleted the private matcher that used to live inside OnlineFetch. That was the
          right move - research and durable memory now share one relevance decision
          instead of two copies that could drift apart - but it left main red: four
          assertions in tmp/verify_patches.py still looked for the deleted matcher by
          name, so "Verify source integrity" failed on the merge commit and no release
          could be built from main at all.

          The four assertions are not deleted, because what they guard is real: that the
          fetch gate accepts a two-keyword match rather than demanding a flat coverage
          floor, that the fetcher still tries three Wikipedia hits, that the gate counts
          every-script content words instead of ASCII length, and that Coverage is still
          the coverage measure. They now read the rule where it actually lives, and a new
          v9.33.155 block pins the shape of the move: one acceptsFetchedSource, no
          "fun hits(" left in OnlineFetch, no Coverage.ratio call left in it either. If a
          later change copies the gate back into the fetcher, this fails.

          The 2-whole-word rule also gains the test it never had. minWholeWordHits was a
          parameter with a default nobody exercised; a page that mentions two of the
          query's words passed only because the default happened to allow it. The new
          case raises the parameter to 99 with a coverage floor of 1.0 and asserts the
          page is refused, then asserts the same page is accepted at the defaults - so
          the parameter is proven to be read, not decorative.
          MSG
          echo "release commit: $(git log -1 --format='%h %s')"
      - name: The release removes its own one-shot workflow
        run: |
          git rm -q .github/workflows/apply-933155.yml
          git commit -q --amend --no-edit
          git show --stat --format="" HEAD

      - name: Verify the patched tree before it is pushed
        run: python3 tmp/verify_patches.py .

      - name: Confirm the version the release claims
        run: |
          VER="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)"
          CODE="$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' android/app/build.gradle | head -1)"
          echo "versionName=$VER versionCode=$CODE"
          [ "$VER" = "9.33.155" ] || { echo "FATAL: versionName is $VER"; exit 1; }
          [ "$CODE" = "323" ] || { echo "FATAL: versionCode is $CODE"; exit 1; }

      - name: Push the release commit to main
        run: git push origin HEAD:main
