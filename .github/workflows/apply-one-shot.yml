name: Apply one-shot patch

# A one-shot applier for a release whose change touches several large files.
# It exists for exactly one purpose and is deleted once that release is green:
# committing eight whole Kotlin/gradle files through the contents API is both
# enormous and racy, while a small script that asserts the exact blob SHAs it
# was written against and then runs the repo's own verifier is reviewable in
# one screen. The script aborts before writing anything if a target file moved.
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Patch script under tmp/ to run'
        required: true
        default: 'tmp/apply_v9_33_76.py'
      message:
        description: 'Commit message'
        required: true
        default: 'v9.33.76: every-script retrieval terms'

concurrency:
  group: apply-one-shot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NOVA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the patch script (it verifies the source and itself)
        run: python3 "${{ inputs.script }}" .

      - name: Commit and push
        run: |
          git config user.name "NOVA patcher"
          git config user.email "nova-patcher@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed - the patch was already applied"
            exit 0
          fi
          git commit -m "${{ inputs.message }}"
          git push
