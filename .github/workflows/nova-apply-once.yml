name: NOVA one-shot apply (v9.33.16)

# One-shot: applies tmp/patch_engine84.py to main and deletes itself from the
# tree in the same commit, so only the release lands. The push is made with
# the workflow's GITHUB_TOKEN, which does not start other workflows - the
# release build is dispatched by hand afterwards (nova-apk.yml).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-apply-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NOVA (full history so the push is a fast-forward)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the v9.33.16 patch (and self-verify)
        run: python3 tmp/patch_engine84.py .
      - name: Commit the release to main
        run: |
          git config user.name "NOVA bot"
          git config user.email "noreply@github.com"
          # the one-shot workflow itself must never land on main - only its
          # result does; drop it from the tree before committing
          rm -f .github/workflows/nova-apply-once.yml
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit \
            -m "v9.33.16: the deterministic core, proven + honest [skip ci]" \
            -m "Records the deadline radar's date rules as real unit tests (dateAt is internal now, behaviour unchanged) and stops focus mode reporting success when its session could not be saved. tmp/verify_patches.py passes; version 9.33.16 / versionCode 184."
          git push origin HEAD:main
