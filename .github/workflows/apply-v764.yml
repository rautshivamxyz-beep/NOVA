name: Apply v7.6.4 updater change
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NOVA
        uses: actions/checkout@v4

      - name: Apply the patch and push
        run: |
          cat tmp/patch_parts/v764_aa tmp/patch_parts/v764_ab tmp/patch_parts/v764_ac tmp/patch_parts/v764_ad | tr -d '\n' | base64 -d | gunzip > /tmp/patch.py
          python3 /tmp/patch.py
