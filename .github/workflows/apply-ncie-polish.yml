name: Apply NCIE polish

on: workflow_dispatch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boundary polish - patch, guard, commit
        run: |
          python3 tmp/ncie_polish_patch.py
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git add -A
          git commit -m "NCIE v0.7.0 polish (#1): the last direct calls behind the kernel boundary" \
            -m "MainActivity's five direct Knowledge.* calls (warm-up, summarizer chunks, notes filter, save-to-knowledge), KnowledgeActivity's six, and the five direct NovaEngine.send sites now go through NcieKnowledge and NovaEngineAdapter. Knowledge.kt is storage-only plumbing, like NovaEngine behind the adapter. Guard updated and run green before this commit."
          git push
