name: Build Wikipedia dataset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build dataset
        run: python .github/scripts/build_wiki_dataset.py wiki/articles-v1.txt
      - name: Commit dataset
        run: |
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git add wiki/articles-v1.txt
          git commit -m "update Wikipedia dataset (auto)" || echo "no changes"
          git push
