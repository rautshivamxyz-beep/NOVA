name: apply-v549
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tmp/fix_v549b.py
      - name: Commit applied patch
        run: |
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git add android/app/src/main/java/org/nova/KnowledgeActivity.kt
          git commit -m "v5.4.9b: fix TextView text shadowing compile error (applied by CI)"
          git push
