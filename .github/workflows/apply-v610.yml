name: apply-v610
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tmp/apply_v610.py
      - name: Commit applied patch
        run: |
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git add android/app/build.gradle android/app/src/main/java/org/nova/MainActivity.kt
          git commit -m "v6.1.0: year-loop guard + LaTeX math rendering (applied by CI)"
          git push
