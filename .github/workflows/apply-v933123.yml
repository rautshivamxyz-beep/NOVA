name: Apply v9.33.123 patch
# One-shot: applies tmp/patch_v933123.py, proves the result with the full
# verifier, then commits and pushes it. The push uses GITHUB_TOKEN, which
# triggers no workflow - nova-apk.yml is dispatched by hand afterwards, so
# exactly one APK build runs for this version.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NOVA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the patch
        run: python3 tmp/patch_v933123.py .
      - name: Prove it with the full verifier
        run: python3 tmp/verify_patches.py .
      - name: Commit and push
        run: |
          git config user.name "NOVA release bot"
          git config user.email "rautshivamxyz@gmail.com"
          git add -A
          git commit -m 'v9.33.123 "The scheduled text is the whole text": the scheduled-texts store was the one the v9.33.119 and v9.33.121 sweep missed, and it had two doors. First, load answered an empty list for a file it could not read and add wrote that list straight back, so one bad read deleted every scheduled text the user had while NOVA still answered "Scheduled: ... to ..." - true about the new one and a lie about the rest. The store is read through NcieFiles.readOrNull now, add and fireDue refuse to write when the read failed, and the reply says so instead of claiming a schedule that did not happen. Second, the file is one tab-separated line per send and the message was written into it raw: a two-line draft was cut at the first newline on the next load and NOVA still reported it sent with the shortened text, and a TAB in the message ate the rest of it and its remainder became the notified flag. The fields are escaped on the way out and unescaped on the way in - a line written before this release carries no backslash and decodes exactly as it did - and the line format is one pure encode/decode pair, pinned by thirteen JVM tests and eight verify checks.'
          git push
