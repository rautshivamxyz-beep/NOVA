name: Apply v9.33.115 patch
# One-shot: applies tmp/patch_v933115.py, proves the result with the full
# verifier, then commits and pushes it. The push uses GITHUB_TOKEN, which
# triggers no workflow - nova-apk.yml is dispatched by hand afterwards, so
# exactly one APK build runs for this version.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NOVA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the patch
        run: python3 tmp/patch_v933115.py .
      - name: Prove it with the full verifier
        run: python3 tmp/verify_patches.py .
      - name: Commit and push
        run: |
          git config user.name "NOVA release bot"
          git config user.email "rautshivamxyz@gmail.com"
          git add -A
          git commit -m 'v9.33.115 "A re-arm is not a new alarm": three copies of the reminder re-arm loop existed - the launch path in MainActivity, the boot receiver and the A4 watchdog - and every one of them armed through Reminder.schedule, which minted a FRESH alarm id on every call. An AlarmManager PendingIntent is identified by its request code, so a new id is a DIFFERENT alarm and nothing cancelled the old one: re-arming a reminder did not replace its alarm, it added a second. MainActivity re-armed every stored reminder on EVERY launch, so two launches meant two notifications for one reminder, three meant three, and each press of "system check" added one more; the id counter climbed with every launch for the same reason. v9.33.89 also replaced the add-the-interval roll-forward "everywhere it happens", but its sweep listed four files and MainActivity.kt was not one of them, so the hang it removed was still sitting on the launch path. A reminder now owns its alarm id from the moment it is stored, so every re-arm REPLACES its alarm instead of adding another; one re-arm pass (ReminderStore.rearm) serves the launch path, the boot receiver and the watchdog, and one pure arming rule (ReminderStore.nextArm) decides when each fires. Pinned by six new verify checks and six new unit tests.'
          git push
