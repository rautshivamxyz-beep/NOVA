name: Apply v7.6.3 update button
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout NOVA
        uses: actions/checkout@v4

      - name: Apply and push
        run: |
          cat tmp/patch_parts/v763_aa tmp/patch_parts/v763_ab tmp/patch_parts/v763_ac tmp/patch_parts/v763_ad tmp/patch_parts/v763_ae tmp/patch_parts/v763_af tmp/patch_parts/v763_fg tmp/patch_parts/v763_ah | tr -d '\n' | base64 -d | gunzip > /tmp/patch.py
          python3 /tmp/patch.py
