# ONE-SHOT apply workflow for v9.33.85 (a deadline written for today is due today).
# Temporary: it exists only to run the patch step on the real tree and commit
# the result. A GITHUB_TOKEN push triggers no CI, so nova-apk.yml is dispatched
# by hand afterwards. Delete this file once the release is green.
name: Apply one-shot patch
on:
  workflow_dispatch:
concurrency:
  group: nova-apply
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NOVA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The patch (its final verify_patches run is the gate)
        run: python3 tmp/patch_engine88.py .
      - name: Commit and push the patched tree
        run: |
          git config user.name "nova-bot"
          git config user.email "rautshivamxyz@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit - the patch was already applied"
            exit 0
          fi
          VER="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)"
          echo "committing v${VER}"
          git commit -m "v${VER}: a deadline written for today is due today" \
            -m "The deadline radar added a date found in the user's notes only when it fell inside now..horizon. A date-only value resolves to midnight, so 'assignment due 29 Oct' compared as 00:00 against 14:30 and was dropped for the whole of the 29th - the one day it mattered most. The formatter even had a 'today' branch a note date could never reach." \
            -m "Note dates are now measured from the start of today (onRadar(), pure arithmetic). Reminders keep the now floor on purpose: one that already fired is done, not due. Three verify checks and one unit test pin the boundary and keep the two windows from drifting into each other."
          git push origin HEAD:main
