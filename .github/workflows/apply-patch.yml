# ONE-SHOT apply workflow for v9.33.84 (the lookup never quotes an unrelated line).
# Temporary: it exists only to run the patch step on the real tree and commit
# the result. A GITHUB_TOKEN push triggers no CI, so nova-apk.yml is dispatched
# by hand afterwards. Delete this file once the release is green.
name: Apply one-shot patch
on:
  workflow_dispatch:
concurrency:
  group: nova-apply
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NOVA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The patch (its final verify_patches run is the gate)
        run: python3 tmp/patch_engine87.py .
      - name: Commit and push the patched tree
        run: |
          git config user.name "nova-bot"
          git config user.email "rautshivamxyz@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit - the patch was already applied"
            exit 0
          fi
          VER="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)"
          echo "committing v${VER}"
          git commit -m "v${VER}: the lookup never quotes an unrelated line" \
            -m "NcieGround.retrieve returns a chunk when it matched only semantically (cosine >= 0.30, zero keyword overlap). The lookup quoted the first line of whatever it was handed, so such a hit was printed under 'Your notes on X' with 'Quoted straight from your notes - nothing added' - a paraphrase dressed up as a quote, the exact failure the command exists to prevent. It also burned one of the four quote slots." \
            -m "body() now skips a hit whose line holds none of the question's content words, and falls back to the honest 'nothing in your notes mentions ...' when no line survives. Four verify checks and two unit tests pin it."
          git push origin HEAD:main
