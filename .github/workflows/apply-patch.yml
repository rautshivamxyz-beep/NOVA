# ONE-SHOT apply workflow for v9.33.86 (Tier 1 device senses).
# Temporary: it exists only to run the patch step on the real tree and commit
# the result. A GITHUB_TOKEN push triggers no CI, so nova-apk.yml is dispatched
# by hand afterwards. Delete this file once the release is green.
name: Apply one-shot patch
on:
  workflow_dispatch:
concurrency:
  group: nova-apply
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NOVA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The patch (its final verify_patches run is the gate)
        run: python3 tmp/patch_engine89.py .
      - name: Commit and push the patched tree
        run: |
          git config user.name "nova-bot"
          git config user.email "rautshivamxyz@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit - the patch was already applied"
            exit 0
          fi
          VER="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)"
          echo "committing v${VER}"
          git commit -m "v${VER}: Tier 1 device senses" \
            -m "'battery' / 'am i online' / 'device status' now answers from the phone itself: battery level and charging, network type, screen state and free storage, in one deterministic block with no model call. Battery and screen state need no permission at all, ACCESS_NETWORK_STATE was already declared, and StatFs reads the app's own directory - so Tier 1 costs the user no new ask." \
            -m "It is also a speed win: a question about the phone used to go to the model, which generated guesses about a device it cannot see. The reply text is built by NcieSenses.format, pure Kotlin, so the wording and the honesty rules (an unreadable battery is 'not readable', never '0%') are unit-tested. Six verify checks and six unit tests pin it."
          git push origin HEAD:main
