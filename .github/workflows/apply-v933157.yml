name: Apply v9.33.157
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-v933157
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NOVA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the v9.33.157 patch
        run: python3 tmp/patch_v933157.py .
      - name: Commit and push
        run: |
          git config user.name "NOVA Applier"
          git config user.email "nova-applier@users.noreply.github.com"
          git add -A
          git commit -m 'v9.33.157 "The radar audits itself"'
          git push
