name: NOVA PR checks

# v9.33.14: the repo had NO checks on pull requests - nova-apk.yml only runs
# on a push to main, so every PR was merged blind. This runs the source
# verifier and the pure-kernel unit tests on every PR.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: nova-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Source verification
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NOVA
        uses: actions/checkout@v4
      - name: Verify source integrity
        run: python3 tmp/verify_patches.py .

  unit-tests:
    name: Unit tests (pure kernel)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NOVA
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run the unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Upload the test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          retention-days: 3

  # Release-only checks catch R8/minification and packaging failures before
  # merge. The main APK workflow builds releases only after a push to main,
  # which is too late to protect a pull request.
  release-build:
    name: Release APK build (R8 + packaging)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NOVA
        uses: actions/checkout@v4

      - name: Bundle the pinned on-device embedding model
        run: |
          mkdir -p android/app/src/main/assets
          curl -fL --retry 3 -o android/app/src/main/assets/embedder.onnx \
            "https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/main/onnx/model_quantized.onnx"
          echo "afdb6f1a0e45b715d0bb9b11772f032c399babd23bfc31fed1c170afc848bdb1  android/app/src/main/assets/embedder.onnx" | sha256sum -c -
          curl -fL --retry 3 -o android/app/src/main/assets/embedder.vocab \
            "https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/main/vocab.txt"
          echo "07eced375cec144d27c900241f3e339478dec958f92fddbc551f295c992038a3  android/app/src/main/assets/embedder.vocab" | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
