name: Restore files v5.2
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patches and verify
        run: |
          set -e
          git show 2ea9aa5035924c1deb1f3505e53fde24f04e74c3:android/app/src/main/java/org/nova/MainActivity.kt > android/app/src/main/java/org/nova/MainActivity.kt
          git show 2ea9aa5035924c1deb1f3505e53fde24f04e74c3:android/app/src/main/java/org/nova/PdfDoc.kt > android/app/src/main/java/org/nova/PdfDoc.kt
          git apply --unidiff-zero --ignore-whitespace tmp/main52.patch
          git apply --unidiff-zero --ignore-whitespace tmp/pdfdoc52.patch
          sed -i 's/take(11000)}", 800/take(11000)}", 1500/' android/app/src/main/java/org/nova/MainActivity.kt
          sed -i 's/take(11000), 800/take(11000), 1500/' android/app/src/main/java/org/nova/MainActivity.kt
          echo "d0aa67687a80e5b9fe9ea76760b3a1d0  android/app/src/main/java/org/nova/MainActivity.kt" | md5sum -c -
          echo "2c40be43ded858687d5aafcbe174516d  android/app/src/main/java/org/nova/PdfDoc.kt" | md5sum -c -
          git rm -rqf tmp
          git add android/app/src/main/java/org/nova/MainActivity.kt android/app/src/main/java/org/nova/PdfDoc.kt
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git commit -m "v5.2: detailed finals, pipeline for all docs, table column repair"
          git push
