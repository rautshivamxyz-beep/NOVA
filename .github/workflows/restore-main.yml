name: Restore MainActivity v3.3
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and verify
        run: |
          set -e
          git show 101aad5ee583079fcdd45229d0f9a6c503f6e522:android/app/src/main/java/org/nova/MainActivity.kt > android/app/src/main/java/org/nova/MainActivity.kt
          git apply tmp/main33.patch
          echo "c7410278be1d8d27d7bbf79d044dea8a  android/app/src/main/java/org/nova/MainActivity.kt" | md5sum -c -
          git rm -rqf tmp
          git add android/app/src/main/java/org/nova/MainActivity.kt
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git commit -m "MainActivity.kt v3.3: summary dedupe, whole-doc routing, stride cap"
          git push
