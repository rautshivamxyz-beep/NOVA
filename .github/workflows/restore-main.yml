name: Restore NOVA main source
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout NOVA
        uses: actions/checkout@v4
      - name: Fetch the pristine v5.4 sources commit
        run: |
          set -e
          git fetch --depth=1 origin d14309662f967f5a224047baaa8dc94dd7899a88
      - name: Restore v5.4 sources and apply v5.4.1 patch
        run: |
          set -e
          git show d14309662f967f5a224047baaa8dc94dd7899a88:android/app/src/main/java/org/nova/MainActivity.kt > android/app/src/main/java/org/nova/MainActivity.kt
          git apply --unidiff-zero --ignore-whitespace tmp/main541.patch
          md5sum android/app/src/main/java/org/nova/MainActivity.kt
      - name: Verify md5
        run: |
          set -e
          [ "$(md5sum android/app/src/main/java/org/nova/MainActivity.kt | cut -d' ' -f1)" = "3a7c6971f416235950fe05cd211d9503" ]
      - name: Commit v5.4.1 sources
        run: |
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git add android/app/src/main/java/org/nova/MainActivity.kt
          git commit -m "v5.4.1: summary-noun and whole-chapter routing"
          git push
