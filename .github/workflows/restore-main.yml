name: Restore MainActivity v3.7
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and verify
        run: |
          set -e
          git show 58f1391c400cd52406934ee1547f56db2607845b:android/app/src/main/java/org/nova/MainActivity.kt > android/app/src/main/java/org/nova/MainActivity.kt
          git apply tmp/main37.patch
          echo "6de9a4c9a669098f056beb31acf1a918  android/app/src/main/java/org/nova/MainActivity.kt" | md5sum -c -
          git rm -rqf tmp
          git add android/app/src/main/java/org/nova/MainActivity.kt
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git commit -m "MainActivity.kt v3.7: fresh engine before final combine, context-safe budget, derailment fallback"
          git push
