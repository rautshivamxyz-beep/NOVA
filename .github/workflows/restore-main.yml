name: Restore files v3.6b
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and verify
        run: |
          set -e
          git apply --ignore-whitespace tmp/pdfdoc2.patch
          echo "7db71bae08de94be707c8a67fee796da  android/app/src/main/java/org/nova/PdfDoc.kt" | md5sum -c -
          git rm -rqf tmp
          git add android/app/src/main/java/org/nova/PdfDoc.kt
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git commit -m "PdfDoc: cache-bust so v3.6 extraction replaces old cached text"
          git push
