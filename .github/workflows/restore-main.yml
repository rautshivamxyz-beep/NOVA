name: Fix v5.0 import
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix ML Kit import and verify
        run: |
          set -e
          sed -i 's#^import com.google.mlkit.vision.text.TextRecognizerOptions$#import com.google.mlkit.vision.text.latin.TextRecognizerOptions#' android/app/src/main/java/org/nova/PdfDoc.kt
          echo "fa27931e2e23c32a7532c15bb60555d3  android/app/src/main/java/org/nova/PdfDoc.kt" | md5sum -c -
          git add android/app/src/main/java/org/nova/PdfDoc.kt
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git commit -m "v5.0 fix: TextRecognizerOptions lives in the latin subpackage"
          git push
