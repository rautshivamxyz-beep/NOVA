name: Restore NOVA main source
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout NOVA
        uses: actions/checkout@v4
      - name: Restore pristine sources and apply v5.4 patches
        run: |
          set -e
          git show 5d5da11ff1e26cc4ba3398fbe80a154047684d65:android/app/src/main/java/org/nova/MainActivity.kt > android/app/src/main/java/org/nova/MainActivity.kt
          git apply --unidiff-zero --ignore-whitespace tmp/main54.patch
          git show 5d5da11ff1e26cc4ba3398fbe80a154047684d65:android/app/src/main/java/org/nova/Knowledge.kt > android/app/src/main/java/org/nova/Knowledge.kt
          git apply --unidiff-zero --ignore-whitespace tmp/knowledge54.patch
          md5sum android/app/src/main/java/org/nova/MainActivity.kt android/app/src/main/java/org/nova/Knowledge.kt
      - name: Verify md5s
        run: |
          set -e
          [ "$(md5sum android/app/src/main/java/org/nova/MainActivity.kt | cut -d' ' -f1)" = "7ebd475342c4775dacdac9f13ea6c01b" ]
          [ "$(md5sum android/app/src/main/java/org/nova/Knowledge.kt | cut -d' ' -f1)" = "097d5db0478e3b2eaef22710d45fd2c6" ]
      - name: Commit v5.4 sources
        run: |
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git add android/app/src/main/java/org/nova/MainActivity.kt android/app/src/main/java/org/nova/Knowledge.kt
          git commit -m "v5.4: grounded answers, word-boundary retrieval, page citations, Q&A cache, derailed-retry"
          git push
