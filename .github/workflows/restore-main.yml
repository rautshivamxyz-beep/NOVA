name: Restore MainActivity v5.1
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and verify
        run: |
          set -e
          git show 403c8108aabf9f0bb05e76a8d9ce2fdfc0e659aa:android/app/src/main/java/org/nova/MainActivity.kt > android/app/src/main/java/org/nova/MainActivity.kt
          git apply --ignore-whitespace tmp/main51.patch
          echo "3af26b9473283ac2763cafc1a83121b2  android/app/src/main/java/org/nova/MainActivity.kt" | md5sum -c -
          git rm -rqf tmp
          git add android/app/src/main/java/org/nova/MainActivity.kt
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git commit -m "MainActivity.kt v5.1: bigger sections, batch reloads, structured finals"
          git push
