name: Restore MainActivity v4.0
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and verify
        run: |
          set -e
          git show 54bca561d20d10dcc5b45fb50833300bb7382c8b:android/app/src/main/java/org/nova/MainActivity.kt > android/app/src/main/java/org/nova/MainActivity.kt
          git apply tmp/main40.patch
          echo "6bfdebb00e8403317aec0c6ac1325293  android/app/src/main/java/org/nova/MainActivity.kt" | md5sum -c -
          git rm -rqf tmp
          git add android/app/src/main/java/org/nova/MainActivity.kt
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git commit -m "MainActivity.kt v4.0: skip redundant reloads, checkpoint/resume, early-stop on repeats"
          git push
