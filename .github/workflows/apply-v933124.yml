name: Apply v9.33.124 patch
# One-shot: applies tmp/patch_v933124.py, proves the result with the full
# verifier, then commits and pushes it. The push uses GITHUB_TOKEN, which
# triggers no workflow - nova-apk.yml is dispatched by hand afterwards, so
# exactly one APK build runs for this version.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NOVA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the patch
        run: python3 tmp/patch_v933124.py .
      - name: Prove it with the full verifier
        run: python3 tmp/verify_patches.py .
      - name: Commit and push
        run: |
          git config user.name "NOVA release bot"
          git config user.email "rautshivamxyz@gmail.com"
          git add -A
          git commit -m 'v9.33.124 "A conversation that could not be read is not a new chat": ChatStore.load answers null for two different situations - the file is not there, and the file is there and could not be read - and onCreate took that null and started a brand new chat, repointed currentChatId at it, and said nothing. The conversation is the most precious state NOVA owns and it was the one store the v9.33.119, v9.33.121 and v9.33.123 sweep never reached. Nothing was deleted (the new chat gets its own id) but the chat list skips the damaged file as well, so from the inside the app looked exactly as if every message had been thrown away. The parse moves into a pure ChatStore.parse so both halves of the answer are pinned by a JVM test - one bad message row still costs that row only, and text that is not a conversation at all is null, never a throw - load is that function over the file, and ChatStore.unreadable answers the question load cannot. The open path asks it, and when the answer is yes it says so in the chat instead of letting a damaged conversation look like a deletion. The words ship in English and Hindi, and the release is pinned by seven new verify checks and ten new unit tests.'
          git push
