name: Apply v9.33.116 patch
# One-shot: applies tmp/patch_v933116.py, proves the result with the full
# verifier, then commits and pushes it. The push uses GITHUB_TOKEN, which
# triggers no workflow - nova-apk.yml is dispatched by hand afterwards, so
# exactly one APK build runs for this version.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NOVA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the patch
        run: python3 tmp/patch_v933116.py .
      - name: Prove it with the full verifier
        run: python3 tmp/verify_patches.py .
      - name: Commit and push
        run: |
          git config user.name "NOVA release bot"
          git config user.email "rautshivamxyz@gmail.com"
          git add -A
          git commit -m 'v9.33.116 "A repeating reminder is not due all day": the spoken nudge announced "You have a reminder due" from a count of rows whose START time was in the past - and the start time of a repeating reminder is in the past from the day it is created, because nothing ever advances it. One daily 9am reminder therefore had NOVA say it out loud every 30 minutes, all day, every day, while the alarm that actually carries the reminder had already fired and was waiting for tomorrow. The count never went down, so nothing ever stopped it. What "due" means is one pure function now (ReminderStore.isDue): a repeating reminder is due when its NEXT fire is within the hour, and a one-shot is due when its time has passed and it is still on disk - the one case the nudge can add anything to, because an alarm that fired on time already told the user. Pinned by three new verify checks and four new unit tests.'
          git push
