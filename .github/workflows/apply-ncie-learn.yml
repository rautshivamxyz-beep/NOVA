name: Apply NCIE learn wiring

on: workflow_dispatch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smart Skip wiring - patch, guard, commit
        run: |
          python3 tmp/ncie_learn_patch.py
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git add -A
          git commit -m "NCIE v0.7.0 wiring (#1): Smart Skip + quality gate in the live chat turn" \
            -m "The turn-completion path now hands finished answers to the kernel's LEARN phase (NcieLearn.record), quality-gated and async on disk; an exact repeat is served instantly by NcieLearn.recall in ncieSend. Guard updated with both markers and run green before this commit."
          git push
