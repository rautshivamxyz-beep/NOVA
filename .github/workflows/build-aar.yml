name: Build llama.cpp AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          path: llama.cpp

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "cmake;3.31.6" "ndk;29.0.13113456" > /dev/null

      - name: Allow Android 11 (minSdk 30)
        run: |
          sed -i 's/minSdk = 33/minSdk = 30/' llama.cpp/examples/llama.android/lib/build.gradle.kts

      - name: Build the binding
        working-directory: llama.cpp/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew :lib:assembleRelease --no-daemon

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: llama-android-aar
          path: llama.cpp/examples/llama.android/lib/build/outputs/aar/*.aar
