name: Build NOVA Desktop (Windows CUDA)

on:
  workflow_dispatch:
  push:
    branches:
      - "desktop/**"
    paths:
      - "desktop/**"
      - ".github/workflows/nova-desktop-windows.yml"

permissions:
  contents: read

concurrency:
  group: nova-desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build portable Windows desktop package
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout NOVA
        uses: actions/checkout@v4

      - name: Checkout pinned llama.cpp source
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: v1.0.0
          path: llama-src

      - name: Install CUDA Toolkit 12.4 for the build
        uses: ./llama-src/.github/actions/windows-setup-cuda
        with:
          cuda_version: "12.4"
          cuda_arch: "x64"

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Build CPU backend and local server
        shell: cmd
        run: |
          call "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Auxiliary\\Build\\vcvarsall.bat" x64
          cmake -S llama-src -B build-cpu -G "Ninja Multi-Config" ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_OPENMP=OFF ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DLLAMA_BUILD_EXAMPLES=OFF
          if errorlevel 1 exit /b 1
          cmake --build build-cpu --config Release -j %NUMBER_OF_PROCESSORS% --target llama-server
          if errorlevel 1 exit /b 1

      - name: Build NVIDIA CUDA backend for RTX 30-series Ampere
        shell: cmd
        run: |
          call "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Auxiliary\\Build\\vcvarsall.bat" x64
          cmake -S llama-src -B build-cuda -G "Ninja Multi-Config" ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CPU=OFF ^
            -DGGML_CUDA=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=86 ^
            -DGGML_CUDA_CCCL_VERSION=v3.4.3 ^
            -DLLAMA_BUILD_SERVER=OFF ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DLLAMA_BUILD_EXAMPLES=OFF
          if errorlevel 1 exit /b 1
          cmake --build build-cuda --config Release -j %NUMBER_OF_PROCESSORS% --target ggml-cuda
          if errorlevel 1 exit /b 1

      - name: Assemble portable offline package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'dist/NOVA-Desktop-Windows'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'models') | Out-Null

          $cpuBin = Join-Path $env:GITHUB_WORKSPACE 'build-cpu/bin/Release'
          $cudaBin = Join-Path $env:GITHUB_WORKSPACE 'build-cuda/bin/Release'
          if (-not (Test-Path (Join-Path $cpuBin 'llama-server.exe'))) {
            throw "llama-server.exe was not produced in $cpuBin"
          }
          if (-not (Test-Path (Join-Path $cudaBin 'ggml-cuda.dll'))) {
            throw "ggml-cuda.dll was not produced in $cudaBin"
          }

          Copy-Item (Join-Path $cpuBin '*') $stage -Recurse -Force
          Copy-Item (Join-Path $cudaBin 'ggml-cuda.dll') $stage -Force
          Copy-Item 'desktop/start-nova-windows.bat' $stage -Force
          Copy-Item 'desktop/create-desktop-shortcut.bat' $stage -Force
          Copy-Item 'desktop/README.md' $stage -Force
          Copy-Item 'desktop/nova-web' (Join-Path $stage 'nova-web') -Recurse -Force
          Copy-Item 'llama-src/LICENSE' (Join-Path $stage 'LLAMA-CPP-LICENSE') -Force
          New-Item -ItemType File -Force -Path (Join-Path $stage 'models/.gitkeep') | Out-Null

          # Bundle only the CUDA runtime DLLs that llama.cpp's CUDA backend needs.
          $cudaRuntime = Join-Path $stage 'cudart'
          New-Item -ItemType Directory -Force -Path $cudaRuntime | Out-Null
          foreach ($pattern in @('cudart64_*.dll', 'cublas64_*.dll', 'cublasLt64_*.dll')) {
            $found = @()
            foreach ($folder in @(
              (Join-Path $env:CUDA_PATH 'bin'),
              (Join-Path $env:CUDA_PATH 'lib'),
              (Join-Path $env:CUDA_PATH 'bin/x64')
            )) {
              if (Test-Path $folder) {
                $found += Get-ChildItem $folder -Filter $pattern -File -ErrorAction SilentlyContinue
              }
            }
            foreach ($dll in ($found | Sort-Object FullName -Unique)) {
              Copy-Item $dll.FullName $cudaRuntime -Force
            }
          }
          $requiredRuntime = @('cudart64_12.dll', 'cublas64_12.dll', 'cublasLt64_12.dll')
          foreach ($dll in $requiredRuntime) {
            if (-not (Test-Path (Join-Path $cudaRuntime $dll))) {
              throw "Required CUDA runtime library missing: $dll"
            }
          }

          Copy-Item 'llama-src/LICENSE' (Join-Path $stage 'LICENSE-llama.cpp') -Force
          Get-ChildItem $stage -Recurse -File | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Smoke test packaged engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = Join-Path $env:GITHUB_WORKSPACE 'dist/NOVA-Desktop-Windows/llama-server.exe'
          & $engine --version
          if ($LASTEXITCODE -ne 0) { throw 'llama-server smoke test failed.' }

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/NOVA-Desktop-Windows/*' -DestinationPath 'dist/NOVA-Desktop-Windows-CUDA.zip' -CompressionLevel Optimal

      - name: Upload portable desktop package
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Desktop-Windows-CUDA
          path: dist/NOVA-Desktop-Windows-CUDA.zip
          if-no-files-found: error
          retention-days: 14
