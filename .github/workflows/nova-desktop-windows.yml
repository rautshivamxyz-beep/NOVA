name: Build NOVA Native Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - "desktop/**"
    paths:
      - "desktop/**"
      - ".github/workflows/nova-desktop-windows.yml"

permissions:
  contents: read

concurrency:
  group: nova-native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - name: Checkout NOVA
        uses: actions/checkout@v4

      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: v1.0.0
          path: llama-src

      - name: Install CUDA Toolkit
        uses: ./llama-src/.github/actions/windows-setup-cuda
        with:
          cuda_version: "12.4"
          cuda_arch: "x64"

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Relax obsolete optional workbox asset check
        shell: pwsh
        run: |
          $p = 'llama-src/scripts/ui-assets.cmake'
          $s = Get-Content $p -Raw
          $s = $s -replace '(?m)^\s*if\(NOT found_workbox_js\)\r?\n\s*list\(APPEND missing "workbox\[hash\]\.js"\)\r?\n\s*endif\(\)\r?\n', ''
          Set-Content -Path $p -Value $s -NoNewline
          if ($s -match 'list\(APPEND missing "workbox\[hash\]\.js"\)') { throw 'Could not patch the optional workbox check.' }

      - name: Build llama.cpp with CUDA and CPU fallback
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S llama-src -B build -G "Ninja Multi-Config" ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_OPENMP=OFF ^
            -DGGML_CUDA=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=86 ^
            -DGGML_CUDA_CCCL_VERSION=v3.4.3 ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DLLAMA_BUILD_EXAMPLES=OFF
          if errorlevel 1 exit /b 1
          cmake --build build --config Release -j %NUMBER_OF_PROCESSORS% --target llama-server
          if errorlevel 1 exit /b 1

      - name: Publish native NOVA window
        shell: pwsh
        run: |
          dotnet publish desktop/windows/NOVA.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/NOVA-Desktop
          if ($LASTEXITCODE -ne 0) { throw 'Native app publish failed.' }

      - name: Assemble offline package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'dist/NOVA-Desktop'
          $bin = 'build/bin/Release'
          if (-not (Test-Path "$bin/llama-server.exe")) { throw 'llama-server.exe missing' }
          if (-not (Test-Path "$bin/ggml-cuda.dll")) { throw 'CUDA backend missing' }
          Copy-Item "$bin/*" $stage -Recurse -Force
          Copy-Item 'desktop/nova-web' "$stage/nova-web" -Recurse -Force
          Copy-Item 'llama-src/LICENSE' "$stage/LLAMA-CPP-LICENSE" -Force
          New-Item -ItemType Directory -Force "$stage/models" | Out-Null
          foreach ($pattern in @('cudart64_*.dll','cublas64_*.dll','cublasLt64_*.dll')) {
            Get-ChildItem (Join-Path $env:CUDA_PATH 'bin') -Filter $pattern -File | ForEach-Object { Copy-Item $_.FullName $stage -Force }
          }
          foreach ($dll in @('cudart64_12.dll','cublas64_12.dll','cublasLt64_12.dll')) {
            if (-not (Test-Path (Join-Path $stage $dll))) { throw "Missing CUDA runtime $dll" }
          }
          if (-not (Test-Path "$stage/NOVA.exe")) { throw 'NOVA.exe missing from published output' }

      - name: Smoke test engine
        shell: pwsh
        run: |
          & 'dist/NOVA-Desktop/llama-server.exe' --version
          if ($LASTEXITCODE -ne 0) { throw 'Engine smoke test failed.' }

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path 'dist/NOVA-Desktop/*' -DestinationPath 'dist/NOVA-Desktop-Windows-CUDA.zip' -CompressionLevel Optimal

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build one-click Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler was not installed.' }
          & $iscc 'desktop/windows/NOVA.iss'
          if ($LASTEXITCODE -ne 0) { throw 'NOVA Windows installer build failed.' }
          if (-not (Test-Path 'dist/NOVA-Setup.exe')) { throw 'NOVA-Setup.exe was not created.' }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Windows-Installer
          path: dist/NOVA-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Native-Windows
          path: dist/NOVA-Desktop-Windows-CUDA.zip
          if-no-files-found: error
          retention-days: 14
