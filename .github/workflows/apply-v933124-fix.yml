name: Apply v9.33.124 correction
# One-shot: applies tmp/patch_v933124_fix.py, proves the result with the full
# verifier, then commits and pushes it. The push uses GITHUB_TOKEN, which
# triggers no workflow - nova-apk.yml is dispatched by hand afterwards.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NOVA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the correction
        run: python3 tmp/patch_v933124_fix.py .
      - name: Prove it with the full verifier
        run: python3 tmp/verify_patches.py .
      - name: Commit and push
        run: |
          git config user.name "NOVA release bot"
          git config user.email "rautshivamxyz@gmail.com"
          git add -A
          git commit -m 'v9.33.124 correction "The test was wrong, not the app": the first build of this version was RED on its own unit tests. ChatStoreParseTest called ChatStore.parse on real JSON, and a local JVM unit test has no JSON runtime at all - org.json ships inside android.jar and Gradle replaces that jar with the mockable one, whose every method throws RuntimeException Method not mocked. Every one of those calls landed in parse own catch, so parse answered null for a perfectly good conversation and eight tests died on a NullPointerException. The app was never wrong. parse now asks the cheap question first: a conversation is a JSON object and nothing else is one, so isObject rejects the empty file, the fragment, the array and the literal null before any JSON runtime is touched - the honest half of the answer, and the half a local test can actually pin. The test pins that half and only that half: garbage in, null out, never a throw. The tolerant half, one bad message row costs that row only, is unchanged from v9.33.101 and stays pinned by verify_patches, which reads the source instead of running it. The fix itself is unchanged - the conversation still opens as a new chat, the damaged file is still left untouched, and the user is still told. The whole verifier passes locally against a mirror of the tree.'
          git push
