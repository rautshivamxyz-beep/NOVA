<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA — Desktop</title>
<style>
  :root {
    --bg: #0A0D12;
    --pill: #141926;
    --surface: #171C26;
    --border: #242C3C;
    --divider: #1A2030;
    --text: #EAF0FA;
    --dim: #8B94A7;
    --accent: #5B9BFF;
    --accent-deep: #2E6BE6;
    --bubble: #2E6BE6;
    --send-dim: #232B3A;
    --send-dim-text: #5A6579;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    font-size: 15px;
    overflow: hidden;
  }
  #app { display: flex; height: 100vh; }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 250px; min-width: 250px;
    background: var(--pill);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  #brand {
    padding: 16px 16px 12px;
    font-size: 20px; font-weight: 700; letter-spacing: 2px;
    color: var(--accent);
    display: flex; align-items: center; gap: 8px;
  }
  #brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--send-dim-text); }
  #brand .dot.ok { background: #34C77B; }
  #newchat {
    margin: 4px 12px 10px;
    background: var(--accent-deep); color: #fff;
    border: none; border-radius: 10px;
    padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #newchat:hover { background: var(--accent); }
  #chatlist { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
  .chatitem {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 10px; border-radius: 8px; cursor: pointer;
    color: var(--dim); font-size: 13.5px; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden;
  }
  .chatitem:hover { background: var(--surface); color: var(--text); }
  .chatitem.active { background: var(--surface); color: var(--text); }
  .chatitem .title { overflow: hidden; text-overflow: ellipsis; }
  .chatitem .del {
    display: none; color: var(--dim); border: none; background: none;
    font-size: 14px; cursor: pointer; padding: 0 2px;
  }
  .chatitem:hover .del { display: block; }
  .chatitem .del:hover { color: #ff6b6b; }
  #modelinfo {
    padding: 10px 14px; border-top: 1px solid var(--divider);
    color: var(--dim); font-size: 11.5px; line-height: 1.5;
    overflow-wrap: break-word;
  }
  #modelinfo b { color: var(--text); font-size: 12.5px; }

  /* ---------- Main ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar {
    padding: 10px 18px;
    border-bottom: 1px solid var(--divider);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg);
  }
  #topbar .title { font-size: 15px; font-weight: 600; }
  #settingsbtn {
    background: var(--pill); color: var(--dim);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 14px; cursor: pointer; font-size: 13px;
  }
  #settingsbtn:hover { color: var(--text); }

  /* ---------- Settings drawer ---------- */
  #settings {
    display: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 18px;
  }
  #settings.open { display: block; }
  #settings label { display: block; color: var(--dim); font-size: 12px; margin: 10px 0 4px; }
  #settings textarea, #settings input {
    width: 100%; background: var(--pill); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 13px; font-family: inherit;
  }
  #settings textarea { resize: vertical; min-height: 64px; }
  #settings .row { display: flex; gap: 14px; }
  #settings .row > div { flex: 1; }
  #settings .note { color: var(--dim); font-size: 11px; margin-top: 10px; }

  /* ---------- Chat ---------- */
  #chat { flex: 1; overflow-y: auto; padding: 18px 0; scroll-behavior: smooth; }
  #chatinner { max-width: 780px; margin: 0 auto; padding: 0 18px; }
  .msg { margin-bottom: 14px; display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .bubble {
    max-width: 86%; padding: 10px 14px; border-radius: 14px;
    line-height: 1.55; overflow-wrap: break-word; white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--bubble); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble {
    background: var(--surface); border: 1px solid var(--border);
    border-bottom-left-radius: 4px; white-space: normal;
  }
  .msgtools { display: flex; gap: 6px; margin-top: 4px; visibility: hidden; }
  .msg:hover .msgtools { visibility: visible; }
  .msgtools button, .toolbtn {
    background: none; border: none; color: var(--dim);
    font-size: 11.5px; cursor: pointer; padding: 2px 6px; border-radius: 6px;
  }
  .msgtools button:hover, .toolbtn:hover { color: var(--accent); background: var(--pill); }
  .typing { color: var(--dim); font-style: italic; }

  /* markdown bits */
  .bubble code {
    background: var(--send-dim); border-radius: 4px;
    padding: 1px 5px; font-size: 13px;
    font-family: Consolas, 'Courier New', monospace;
  }
  .bubble pre {
    background: #05070B; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; margin: 8px 0; overflow-x: auto; white-space: pre;
  }
  .bubble pre code { background: none; padding: 0; font-size: 13px; line-height: 1.5; }
  .bubble h1, .bubble h2, .bubble h3 { margin: 10px 0 6px; font-size: 1.05em; }
  .bubble p { margin: 6px 0; }
  .bubble ul, .bubble ol { margin: 6px 0 6px 22px; }
  .bubble a { color: var(--accent); }

  /* ---------- Composer ---------- */
  #composerwrap { padding: 10px 18px 16px; background: var(--bg); }
  #composer {
    max-width: 780px; margin: 0 auto;
    background: var(--pill); border: 1px solid var(--border); border-radius: 16px;
    display: flex; align-items: flex-end; padding: 8px 8px 8px 16px;
  }
  #input {
    flex: 1; background: none; border: none; outline: none; resize: none;
    color: var(--text); font-size: 14.5px; font-family: inherit;
    max-height: 180px; line-height: 1.5; padding: 6px 0;
  }
  #input::placeholder { color: var(--send-dim-text); }
  #send, #stop {
    background: var(--accent-deep); color: #fff; border: none;
    border-radius: 12px; min-width: 40px; height: 38px; margin-left: 8px;
    font-size: 15px; cursor: pointer; font-weight: 600;
  }
  #send:disabled { background: var(--send-dim); color: var(--send-dim-text); cursor: default; }
  #stop { background: #B03A3A; display: none; }
  #hint { max-width: 780px; margin: 6px auto 0; text-align: center; color: var(--send-dim-text); font-size: 11px; }

  /* ---------- Welcome ---------- */
  #welcome { text-align: center; color: var(--dim); padding-top: 12vh; }
  #welcome h1 { color: var(--accent); letter-spacing: 4px; font-size: 34px; margin-bottom: 8px; }
  #welcome p { line-height: 1.7; font-size: 14px; }
  #welcome .spinner {
    display: inline-block; width: 22px; height: 22px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Mobile ---------- */
  @media (max-width: 700px) {
    #sidebar { display: none; }
    .bubble { max-width: 94%; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="brand"><span class="dot" id="statusdot"></span>NOVA</div>
    <button id="newchat">+ New chat</button>
    <div id="chatlist"></div>
    <div id="modelinfo">checking engine…</div>
  </div>
  <div id="main">
    <div id="topbar">
      <div class="title" id="chatitle">NOVA</div>
      <button id="settingsbtn">⚙ Settings</button>
    </div>
    <div id="settings">
      <label>System prompt (how NOVA behaves)</label>
      <textarea id="sysprompt"></textarea>
      <div class="row">
        <div>
          <label>Temperature (0 = strict, 1 = creative)</label>
          <input id="temp" type="number" min="0" max="2" step="0.1">
        </div>
        <div>
          <label>Max answer length (tokens)</label>
          <input id="maxtok" type="number" min="64" max="4096" step="64">
        </div>
      </div>
      <div class="note">Saved on this computer only. Chats and settings stay in your browser — nothing leaves your machine.</div>
    </div>
    <div id="chat"><div id="chatinner"></div></div>
    <div id="composerwrap">
      <div id="composer">
        <textarea id="input" rows="1" placeholder="Ask NOVA anything…"></textarea>
        <button id="send">➤</button>
        <button id="stop">■</button>
      </div>
      <div id="hint">Enter = send · Shift+Enter = new line</div>
    </div>
  </div>
</div>

<script>
"use strict";

/* ---------------- state ---------------- */
var LS_CHATS = "nova_desktop_chats";
var LS_SET   = "nova_desktop_settings";
var DEFAULT_SYS = "You are NOVA, a helpful, honest study assistant. Explain clearly with examples. If you are not sure, say so instead of guessing.";

var chats   = load(LS_CHATS, []);
var settings = load(LS_SET, { sys: DEFAULT_SYS, temp: 0.7, maxtok: 1024 });
var currentId = null;
var generating = false;
var aborter = null;
var modelId = "";

function load(k, d) {
  try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; }
  catch (e) { return d; }
}
function save() {
  localStorage.setItem(LS_CHATS, JSON.stringify(chats));
  localStorage.setItem(LS_SET, JSON.stringify(settings));
}
function cur() { return chats.find(function (c) { return c.id === currentId; }); }
function newChat() {
  var c = { id: Date.now() + "" + Math.floor(Math.random() * 1e6), title: "New chat", msgs: [] };
  chats.unshift(c); currentId = c.id; save(); renderList(); renderChat(); renderTitle();
}

/* ---------------- engine status ---------------- */
function pollHealth() {
  fetch("/health", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
    var ok = j && (j.status === "ok" || j.status === "loading model" || j.status === "model loaded" || j.success !== false);
    setDot(ok);
    if (ok) setTimeout(pollHealth, 5000); else setTimeout(pollHealth, 1500);
  }).catch(function () { setDot(false); setTimeout(pollHealth, 1500); });
}
function setDot(ok) {
  document.getElementById("statusdot").className = ok ? "dot ok" : "dot";
}
function loadModelInfo() {
  fetch("/v1/models", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
    var m = j && j.data && j.data[0];
    if (m) {
      modelId = m.id || "";
      var short = modelId.split(/[\\/]/).pop();
      document.getElementById("modelinfo").innerHTML = "<b>Model</b><br>" + esc(short);
    }
  }).catch(function () {
    document.getElementById("modelinfo").textContent = "engine offline";
  });
}

/* ---------------- rendering ---------------- */
function esc(s) {
  var codes = { "&": 38, "<": 60, ">": 62, '"': 34 };
  return String(s).replace(/[&<>"]/g, function (ch) {
    return "&#" + codes[ch] + ";";
  });
}
function stripThink(src) {
  var LT = String.fromCharCode(60), GT = String.fromCharCode(62);
  var OPEN = LT + "think" + GT, CLOSE = LT + "/think" + GT;
  src = src.replace(new RegExp(OPEN + "[\\s\\S]*?" + CLOSE, "g"), "");
  src = src.replace(new RegExp(OPEN + "[\\s\\S]*$", "g"), "");
  src = src.split(CLOSE).join("");
  return src;
}

function md(raw) {
  var src = stripThink(raw);
  var s = esc(src);
  var blocks = [];
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, function (_, lang, code) {
    blocks.push("<pre><code>" + code.replace(/\n$/, "") + "</code></pre>");
    return "\u0000" + (blocks.length - 1) + "\u0000";
  });
  s = s.replace(/`([^`\n]+)`/g, function (_, c) { return "<code>" + c + "</code>"; });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, "$1<i>$2</i>");
  var out = "";
  var listType = null;
  var para = [];
  function flushPara() { if (para.length) { out += "<p>" + para.join("<br>") + "</p>"; para = []; } }
  function flushList() { if (listType) { out += "</li></" + listType + ">"; listType = null; } }
  var PH = /\u0000(\d+)\u0000/;
  s.split("\n").forEach(function (line) {
    var m2;
    var ph = line.match(PH);
    if (ph) { flushPara(); flushList(); out += blocks[+ph[1]]; return; }
    if ((m2 = line.match(/^###\s+(.*)/))) { flushPara(); flushList(); out += "<h3>" + m2[1] + "</h3>"; }
    else if ((m2 = line.match(/^##\s+(.*)/))) { flushPara(); flushList(); out += "<h2>" + m2[1] + "</h2>"; }
    else if ((m2 = line.match(/^#\s+(.*)/))) { flushPara(); flushList(); out += "<h1>" + m2[1] + "</h1>"; }
    else if ((m2 = line.match(/^\s*[-*]\s+(.*)/))) {
      flushPara();
      if (listType !== "ul") { flushList(); out += "<ul><li>" + m2[1]; listType = "ul"; }
      else { out += "</li><li>" + m2[1]; }
    }
    else if ((m2 = line.match(/^\s*\d+\.\s+(.*)/))) {
      flushPara();
      if (listType !== "ol") { flushList(); out += "<ol><li>" + m2[1]; listType = "ol"; }
      else { out += "</li><li>" + m2[1]; }
    }
    else if (line.trim() === "") { flushPara(); flushList(); }
    else { para.push(line); }
  });
  flushPara(); flushList();
  return out.trim();
}

function renderList() {
  var el = document.getElementById("chatlist");
  el.innerHTML = "";
  chats.forEach(function (c) {
    var d = document.createElement("div");
    d.className = "chatitem" + (c.id === currentId ? " active" : "");
    var t = document.createElement("span"); t.className = "title"; t.textContent = c.title;
    var x = document.createElement("button"); x.className = "del"; x.textContent = "✕";
    x.onclick = function (e) {
      e.stopPropagation();
      chats = chats.filter(function (o) { return o.id !== c.id; });
      if (currentId === c.id) { currentId = chats.length ? chats[0].id : null; if (!currentId) newChat(); }
      save(); renderList(); renderChat(); renderTitle();
    };
    d.appendChild(t); d.appendChild(x);
    d.onclick = function () { currentId = c.id; renderList(); renderChat(); renderTitle(); };
    el.appendChild(d);
  });
}
function renderTitle() {
  var c = cur();
  document.getElementById("chatitle").textContent = c ? c.title : "NOVA";
}
function renderChat() {
  var inner = document.getElementById("chatinner");
  inner.innerHTML = "";
  var c = cur();
  if (!c || c.msgs.length === 0) {
    inner.innerHTML =
      '<div id="welcome"><div class="spinner"></div>' +
      "<h1>NOVA</h1><p>Desktop edition · your AI, running fully offline on this computer.<br>" +
      "Same brain as the NOVA phone app — same models, same privacy.<br>" +
      (modelId ? "" : "Waiting for the engine to load the model…") + "</p></div>";
    return;
  }
  c.msgs.forEach(function (m, i) { inner.appendChild(msgEl(m, i)); });
  scrollDown();
}
function msgEl(m, idx) {
  var wrap = document.createElement("div");
  wrap.className = "msg " + m.role;
  var b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = m.role === "user" ? esc(m.content) : md(m.content);
  wrap.appendChild(b);
  var tools = document.createElement("div");
  tools.className = "msgtools";
  var cp = document.createElement("button"); cp.textContent = "copy";
  cp.onclick = function () {
    navigator.clipboard.writeText(m.content).catch(function () {});
    cp.textContent = "copied"; setTimeout(function () { cp.textContent = "copy"; }, 1200);
  };
  tools.appendChild(cp);
  if (m.role === "assistant" && idx === cur().msgs.length - 1 && !generating) {
    var rg = document.createElement("button"); rg.textContent = "regenerate";
    rg.onclick = function () { regenerate(); };
    tools.appendChild(rg);
  }
  wrap.appendChild(tools);
  return wrap;
}
function scrollDown() {
  var el = document.getElementById("chat");
  el.scrollTop = el.scrollHeight;
}

/* ---------------- generation ---------------- */
function setBusy(busy) {
  generating = busy;
  document.getElementById("send").style.display = busy ? "none" : "";
  document.getElementById("stop").style.display = busy ? "" : "none";
  if (!busy) renderChat();
}
function messagesFor(c) {
  var msgs = [];
  if (settings.sys && settings.sys.trim()) msgs.push({ role: "system", content: settings.sys.trim() });
  c.msgs.forEach(function (m) { msgs.push({ role: m.role, content: m.content }); });
  return msgs;
}
async function send() {
  var input = document.getElementById("input");
  var text = input.value.trim();
  if (!text || generating) return;
  var c = cur(); if (!c) { newChat(); c = cur(); }
  input.value = ""; autosize();
  c.msgs.push({ role: "user", content: text });
  if (c.title === "New chat") { c.title = text.slice(0, 42) + (text.length > 42 ? "…" : ""); renderTitle(); }
  save(); renderList(); renderChat();
  await generate();
}
async function generate() {
  var c = cur();
  var asst = { role: "assistant", content: "" };
  c.msgs.push(asst);
  var inner = document.getElementById("chatinner");
  var w = document.createElement("div");
  w.className = "msg assistant";
  var b = document.createElement("div");
  b.className = "bubble typing";
  b.textContent = "…";
  w.appendChild(b); inner.appendChild(w); scrollDown();
  setBusy(true);
  aborter = new AbortController();
  var got = false;
  try {
    var res = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: modelId,
        messages: messagesFor({ msgs: c.msgs.slice(0, -1) }),
        temperature: parseFloat(settings.temp) || 0.7,
        max_tokens: parseInt(settings.maxtok) || 1024,
        stream: true
      }),
      signal: aborter.signal
    });
    if (!res.ok) throw new Error("server error " + res.status);
    var reader = res.body.getReader();
    var dec = new TextDecoder();
    var buf = "";
    while (true) {
      var r = await reader.read();
      if (r.done) break;
      buf += dec.decode(r.value, { stream: true });
      var lines = buf.split("\n");
      buf = lines.pop();
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (line.indexOf("data:") !== 0) continue;
        var data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        try {
          var j = JSON.parse(data);
          var d = j.choices && j.choices[0] && j.choices[0].delta;
          if (d && d.content) {
            got = true;
            asst.content += d.content;
            b.className = "bubble";
            b.innerHTML = md(asst.content);
            scrollDown();
          }
        } catch (e) { /* partial json line, skip */ }
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") {
      asst.content += (got ? "\n\n" : "") + "⚠ Could not reach the NOVA engine. Is the start script still running?";
      b.className = "bubble";
      b.innerHTML = md(asst.content);
    }
  }
  if (!asst.content) {
    c.msgs.pop(); // drop empty assistant bubble
  }
  aborter = null;
  save(); setBusy(false);
}
function regenerate() {
  var c = cur();
  if (!c || generating) return;
  while (c.msgs.length && c.msgs[c.msgs.length - 1].role === "assistant") c.msgs.pop();
  if (!c.msgs.length) { renderChat(); return; }
  save(); generate();
}

/* ---------------- composer ---------------- */
function autosize() {
  var t = document.getElementById("input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 180) + "px";
}
document.getElementById("input").addEventListener("input", autosize);
document.getElementById("input").addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById("send").addEventListener("click", send);
document.getElementById("stop").addEventListener("click", function () {
  if (aborter) aborter.abort();
});
document.getElementById("newchat").addEventListener("click", newChat);

/* ---------------- settings ---------------- */
var spanel = document.getElementById("settings");
document.getElementById("settingsbtn").addEventListener("click", function () {
  spanel.classList.toggle("open");
});
var elSys = document.getElementById("sysprompt");
var elTemp = document.getElementById("temp");
var elMax = document.getElementById("maxtok");
elSys.value = settings.sys; elTemp.value = settings.temp; elMax.value = settings.maxtok;
function bindSave(el, key, parse) {
  el.addEventListener("change", function () {
    settings[key] = parse(el.value); save();
  });
}
bindSave(elSys, "sys", function (v) { return v; });
bindSave(elTemp, "temp", parseFloat);
bindSave(elMax, "maxtok", parseInt);

/* ---------------- boot ---------------- */
if (!chats.length) newChat(); else currentId = chats[0].id;
renderList(); renderChat(); renderTitle();
pollHealth(); loadModelInfo();
setInterval(loadModelInfo, 15000);
</script>
</body>
</html>
