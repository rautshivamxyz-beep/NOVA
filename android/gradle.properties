org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.daemon=false
# v9.33.58 (improvement pass): build speed + correctness.
org.gradle.parallel=true
org.gradle.caching=true
kotlin.incremental=true
android.useAndroidX=true
# enableJetifier removed: every dependency is already AndroidX, so Jetifier
# only rewrote bytecode on every build for no benefit.
android.nonTransitiveRClass=true
