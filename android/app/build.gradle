plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    androidResources {
        noCompress += ["gguf"]
    }
    namespace 'org.nova'
    compileSdk 35

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs += ['src/main/jniLibs']
        }
    }

    defaultConfig {
        applicationId 'org.nova'
        minSdk 30
        targetSdk 35
        versionCode 19
        versionName '4.0'
    }

    signingConfigs {
        release {
            storeFile rootProject.file('nova-release.keystore')
            storePassword 'NOVA2026release'
            keyAlias 'nova'
            keyPassword 'NOVA2026release'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // llama.cpp Android binding (com.arm.aichat)
    implementation files('libs/llama-release.aar')

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:syntax-highlight:4.6.2'
    implementation 'io.noties:prism4j:2.0.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}

configurations.all {
    exclude group: 'org.jetbrains', module: 'annotations-java5'
}
