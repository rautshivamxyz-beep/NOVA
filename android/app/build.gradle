plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    androidResources {
        noCompress += ["gguf"]
    }
    namespace 'org.nova'
    compileSdk 35

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            // v5.4.7: smaller APK - drop CPU variants this phone can never
            // use (v8.6/v9.x are for flagship chips; x86_64 is emulator only
            // and already excluded by abiFilters below)
            excludes += ['lib/**/libggml-cpu-android_armv8.6_1.so',
                         'lib/**/libggml-cpu-android_armv9.0_1.so',
                         'lib/**/libggml-cpu-android_armv9.2_1.so',
                         'lib/**/libggml-cpu-android_armv9.2_2.so']
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs += ['src/main/jniLibs']
        }
    }

    defaultConfig {
        applicationId 'org.nova'
        minSdk 30
        targetSdk 35
        versionCode 33
        versionName '5.4.9'
        // v5.4.7: single-ABI build - arm64 only (x86_64 was ~25MB of
        // useless emulator code in every APK download)
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            storeFile rootProject.file('nova-release.keystore')
            storePassword 'NOVA2026release'
            keyAlias 'nova'
            keyPassword 'NOVA2026release'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // llama.cpp Android binding (com.arm.aichat)
    implementation files('libs/llama-release.aar')

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:syntax-highlight:4.6.2'
    implementation 'io.noties:prism4j:2.0.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    // on-device OCR for scanned PDFs (bundled model - fully offline)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}

configurations.all {
    exclude group: 'org.jetbrains', module: 'annotations-java5'
}
