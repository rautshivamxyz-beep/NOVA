plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    androidResources {
        noCompress += ["gguf", "onnx"]
    }
    namespace 'org.nova'
    compileSdk 35

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            // v9.14.1: REVERTED the v9.13.5 "ship every kernel" change. The
            // extra armv8.6 / v9.x variants could change which ggml CPU
            // kernel the loader picks, and the device reported a slowdown
            // right after that release. Back to the v5.4.7 set (armv8.0 +
            // armv8.2 only) - exactly what ran fine before. libggml.so still
            // picks the best of the shipped variants.
            excludes += ['lib/**/libggml-cpu-android_armv8.6_1.so',
                         'lib/**/libggml-cpu-android_armv9.0_1.so',
                         'lib/**/libggml-cpu-android_armv9.2_1.so',
                         'lib/**/libggml-cpu-android_armv9.2_2.so']
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs += ['src/main/jniLibs']
        }
    }

    defaultConfig {
        applicationId 'org.nova'
        minSdk 30
        targetSdk 35
        // v9.0.0: voice - tap-to-talk mic, spoken replies
        // v9.3.0 "Audit Fixes I": notif privacy, per-chat state, robust grading
        // v9.4.0 "Audit Fixes II": restore integrity, voice language, fetch robustness
        // v9.5.0 "Document Grounding": strict from-my-notes answers with sources
        // v9.6.0 "Engine Pack": experience, cache, flashmap, knowledge graph
        // v9.7.0 "Delta Updates + Quiet Fetch": on-device delta patches, offer only when nothing is local
        // v9.8.0 "Scheduled Sends + OCR Notes": scheduled texts via AlarmManager, scan-my-notes photo import
        // v9.9.0 "Semantic RAG": on-device MiniLM embeddings, hybrid semantic+keyword retrieval
        // v9.10.0 "Revision Planner + Hardening": exam countdown, deterministic revision plan, store locking
        // v9.11.0 "Inference Quality": per-model sampling profiles, base system prompt, context budget
        // v9.12.0 "Live Tuning": engine v8.0 live sampling setters wired into the tuning profiles
        // v9.12.1 "Context Diet": relevance-gated document injection, prompt budget cap, honest online offer
        // v9.13.0 "Audit Fixes": background scheduled sends, cache honesty, embedder threading, offer gates
        // v9.13.3 "No-Thinking for 1B+": models 1B and larger skip hidden thinking
        // v9.13.4 "Thinking Tags Hardened": strip <thinking> and every tag variant too
        // v9.13.5 "Full CPU kernels": ship every per-chip ggml variant for max speed
        // v9.13.6 "Faster Qwen3": speculative decoding on by default (identical output)
        // v9.13.7 "LFM 2.5 230M + wider speculation": draft matcher covers Qwen + LFM
        // v9.13.8 "Lean turn": one question embedding per turn, no embedder without docs
        // v9.13.9 "No dropped turns": never fire a prompt into a busy engine; spec decoding off
        // v9.14.0 "Sharp Memory": learn each context source's value; skip the ones that never help
        // v9.14.1: restore speed - revert the extra-kernel change; soften the engine wait
        // v9.15.0 "Camera": in-app camera screen (preview + shutter) -> on-device OCR -> chat
        // v9.16.0 "Private Fetch": route online lookups through a SOCKS proxy (Orbot/Tor); https-only
        // v9.16.1 "Thin Prompt + Hardening": thin base prompt, context-as-data, PBKDF2 PIN, atomic writes, off-thread-safe embed
        // v9.16.2 "Working buttons": stop button really stops, thin summariser prompts, camera on the typing row, more robust online fetch
        // v9.16.3 "Fixes + Automation": launcher visibility, settings in backups, public wiki dataset + update check, unified exam store, phone automation
        // v9.16.4 "Quiz routing fix": strip trailing instruction clauses from
        // "quiz me on X" so NOVA's own "Quiz me" chip works; bare "quiz me"
        // quizzes on the open document / most recent notes
        // v9.16.5 "Direct call + SMS": place the call / send the text ourselves
        // (ACTION_CALL + SmsManager), no dialer or messaging app in the middle;
        // scheduled texts now send in the background
        // v9.16.6 "Contact lookup + graceful fallback": find a contact by name
        // prefix, contacts-filter and a contains scan; call/text never dead-end
        // v9.16.7 "Smaller-model quality + WhatsApp": a tiny-model sampling
        // profile + reply cap + prompt hint, and a real WhatsApp deep link
        // v9.16.8 "Silent reply": answer a chat notification through its own
        // reply action (RemoteInput) - nothing opens
        // v9.16.9 "Auto-responder": opt-in silent auto-reply to new messages
        // v9.16.10 "Encrypted backup": password-protect the backup zip
        // v9.16.11 "Dream mode": the overnight consolidation in the briefing
        // v9.16.12 "Dream mode: nightly": the overnight consolidation runs itself
        // v9.16.13 "Time Machine": find <query> across your notifications,
        // chats and notes
        // v9.16.14 "Jarvis": one-phrase modes - away / back
        // v9.29.0 "Respect the engine": never override a chosen voice
        // v9.29.1 "Feature repairs": one notification listener (NotifBrain's
        // service removed; NovaListener is the single log); voice replies
        // gated by one switch (voiceReplies/read_aloud kept in sync); the
        // wiki download no longer parks a thread in a sleep loop; the
        // embedder fallback is logged; "what did I miss" reads one log.
        // v9.29.2 "Honest search": a web lookup that finds nothing answers
        // honestly instead of letting the model invent facts.
        // v9.29.3 "Tool recipes": NOVA builds its own offline tools from a
        // fixed primitive set; a recipe is data, never code.
        // v9.29.4 "No stuck replies + auto-update": history never reloads as
        // "generating"; NOVA auto-checks for updates on launch.
        // v9.29.5 "Lookups that work": online fetches store and retrieve even
        // without the offline Wikipedia download; disambiguation pages skipped.
        // v9.33.34 "Kernel tests": the pure-JVM decision core (the ANALYZE
        // and PLAN gates) is pinned by real unit tests, so a silent re-route
        // or a starved context budget is caught in CI instead of in the app.
        // v9.33.35: the VERIFY gate joins them (MathVerifier + answer quality).
        // v9.33.36: the ADAPTIVE planner joins them (mastery + struggle rules).
        // v9.33.55: the app's arithmetic gate and the fetched-knowledge
        // coverage gate join them - the two pure functions that decide
        // an instant on-device answer and whether background is injected.
        // v9.33.56: the offline-wiki ranking and the memory graduation
        // ceremony join them - the two decision points that silently
        // shape which background and which facts NOVA keeps.
        // v9.33.57: the capability-gap log joins them - the measured
        // evidence the improvement loop counts.
        // v9.33.58 "Audit Pass": R8 shrinking on, cleartext scoped to the
        //   LAN exception (no global manifest flag), the two giant files
        //   split (MainActivity -> +ChatText/+MessageAdapter,
        //   NcieChat -> +NcieChatExt), a sandboxed JS WebView, a bounded
        //   fetch body, and a batch of null-safety + swallowed-log fixes.
        //   Detail: NOVA-Improvements.md.
        // v9.33.62 "First word sooner + to the point": the standing rules
        //   moved out of every turn's user message into the SYSTEM prompt,
        //   which the engine encodes once per model load and keeps in its KV
        //   cache. Every turn used to re-prefill ~280 tokens of rules (and
        //   store another copy in the KV cache); now it prefills only the
        //   context and the question - the wait before the first word drops,
        //   with the same rules and the same quality. The rulebook's first
        //   line is the new "to the point" default: answer first, and stay
        //   short unless the user asks for detail.
        // v9.33.63 "Streaming reliability": the streaming reply no longer
        //   launches a duplicate local generation after a remote drop, and a
        //   still-busy local engine now fails the turn clearly instead of
        //   silently discarding the prompt.
        // v9.33.64 "Dedup pinned": the reply-deduplication helpers
        //   (dropRepeatedBlocks, cutPartialLine, stripRepeatJoin,
        //   stripRepeatStart, dedupeLines, tail300) - run on every
        //   auto-continued reply and every long summary - get their first
        //   unit tests. No behaviour change; the guard against a silent
        //   duplicate-paragraph regression.
        // v9.33.65 "Grounding pinned": the document-grounding chunker
        //   (NcieGround.chunksOf) and the deterministic grounding prompt
        //   (groundPrompt) - which decide how the user's own notes are split
        //   and quoted back - get their first unit tests. No behaviour change.
        // v9.33.66 "Concise factual answers": the standing rules answer first
        //   and stay short, so a factual question no longer draws a preamble.
        // v9.33.67 "Busy replies pinned": the away-message line parser
        //   (NcieStyle.parseLines) - the pure function that turns the model's
        //   raw reply into the short lines the auto-responder sends while the
        //   user is away - gets its first unit tests. No behaviour change; the
        //   guard against a list marker or stray quote reaching a contact.
        // v9.33.68 "Summary pinned": the rolling-summary sanitizer
        //   (NcieSummary.sanitize) - which strips the summarizer's own prompt
        //   markers before the summary is re-injected - gets its first unit
        //   tests. No behaviour change; the guard against the model reciting
        //   "New message:" / "Answer:" back at the user.
        // v9.33.69 "Fetch text pinned": the HTML-to-text converter (HtmlText)
        //   - toText for the page body, codeBlocks for the <pre> sections kept
        //   verbatim, decodeEntities for the entities - gets its first unit
        //   tests. No behaviour change; the guard against page chrome or
        //   mangled entities reaching the knowledge base on every lookup.
        // v9.33.70 "Source rule pinned": cleanSourceText - the single
        //   implementation of "turn a fetched source into a short, readable
        //   answer" (v9.33.7 merged the two drifted copies into one) - gets
        //   its first unit tests. No behaviour change; the guard against a
        //   search-result paragraph or a mid-sentence truncation.
        // v9.33.71 "Reply and RAM safety": preserve coherent long replies
        //   from false derailment retries and fail safely when Android RAM
        //   capability probes fail.
        // v9.33.75: configurable HTTPS search URL and improved proxy diagnostics.
        // v9.33.76 "Every-script retrieval terms": the four retrieval call
        //   sites that still filtered query words by ASCII character count
        //   now use Tokens.contentWords, so a Hindi/Marathi question keeps
        //   its two-character content words in the tool scorer, the search
        //   acceptance gate and the document window. English unchanged.
        // v9.33.77 "Answer-first window": the document/notes excerpt spends
        //   its character budget on the paragraphs that score best, not on the
        //   ones that come first, and is capped at the budget. Fixes an empty
        //   "from my notes" window and an answer paragraph being dropped.
        // v9.33.78 "Storage robustness": a stale partial download that the
        //   server answers 416 for is cleared instead of failing forever, and
        //   the fetch log is rewritten atomically.
        // v9.33.79 "GGUF card": the model's own header is read once per load -
        //   architecture, name, size_label, context_length and chat_template -
        //   so a model the user renamed or imported is not treated as "size
        //   unknown, therefore full profile". A 0.6B called model.gguf now gets
        //   the lean prompt it needs instead of two background sources and the
        //   exam line. A catalog label still wins, so nothing changes there.
        // v9.33.80 "Notes lookup": "find in my notes: X" / "which note
        //   mentions X" answers with the user's own lines, verbatim, and never
        //   calls the model - instant, impossible to invent, and it works with
        //   no model loaded at all. "from my notes: X" stays the question form.
        // v9.33.81 "Outgoing-answer grounding check": a reply that claims the
        //   user's own notes as its source on an install that holds none is
        //   neutralised and labelled once - the one fabrication the user could
        //   check and cannot trust. With material present nothing is touched.
        // v9.33.82 "Retrieval-first lean prompt": when the user's own
        //   documents already back the turn, the offline-wiki background is not
        //   injected as well - ~1400 characters (about 350 tokens) less to read
        //   before the first word, on exactly the turns the notes answer. One
        //   source decided by retrieval, not two competing ones.
        // v9.33.89 "Dates, not arithmetic": the deadline radar stopped
        //   reading a note's "8.5", "1/2", "3-5" and "10.30" as dates. A bare
        //   day/month now needs a scheduling word beside it (the year-carrying
        //   forms never did), so a maths note no longer reports its own
        //   arithmetic as a deadline. And the repeating-reminder roll-forward
        //   is one step instead of a while-loop - same answer, but a tiny or
        //   corrupt repeat interval can no longer hang the UI thread behind
        //   "what's due", the weekly review and the boot re-arm.
        // v9.33.90 "One way to write a file": every state file NOVA rewrites
        //   in place - the exam date and revision plan, the tuning overrides,
        //   the learned experience, the focus session, the value stats, the
        //   rolling summary, the chunk index behind "from my notes", the
        //   Jarvis trigger log, the fetch log, the tutor's missed list, the
        //   growth log - now goes through one atomic save (NcieFiles.write:
        //   write a .tmp, rename it over the target). A bare writeText
        //   truncates first and writes second, so a kill in between left a
        //   half file that every reader parses defensively - which is why the
        //   symptom was never a crash but a silent reset (an exam date simply
        //   gone, learned facts quietly dropped). 19 call sites, one rule,
        //   pinned by 6 unit tests.
        // v9.33.91 "The answer cache has a ceiling": the cached answers
        //   (qa_<question>_<model>) and the cached document summaries
        //   (doc5_<name>_<length>) in summary_cache were cleared when the
        //   user's material changed but never bounded - one small file per
        //   distinct question ever asked, kept for the life of the install,
        //   all of it stat()ed on every listing. NcieCache.put writes the
        //   entry atomically and keeps the 200 newest of its family.
        // v9.33.92 "Bounded tail": the repetition guard re-checked the whole
        //   reply every 24 characters, so a long answer copied the entire
        //   text again on every check - on the same thread that is receiving
        //   tokens. NcieRepeat only ever reads the last 1600 characters, so
        //   the guard now keeps exactly that much (NcieRepeat.window). Same
        //   verdict, bounded work: the check no longer grows with the reply.
        // v9.33.96 "Reminders hardened": four doors in one small subsystem.
        //   (1) ReminderStore.load read each row with getJSONObject/getString,
        //   so ONE malformed row threw out of the loop and every reminder
        //   after it vanished from the list - and the next save() wrote that
        //   short list back, deleting them for good. Each row stands on its
        //   own now (optJSONObject + optString, a bad row skipped).
        //   (2) The hand-rolled save deleted the old file BEFORE retrying the
        //   rename, so a second failed rename lost the old list and the new
        //   one. It goes through NcieFiles.write, the one atomic save.
        //   (3) nextId fell back to 1 when the counter file did not parse, so
        //   the next reminder reused an id a still-armed alarm was holding
        //   and FLAG_UPDATE_CURRENT replaced it - the exact collision v7.6
        //   fixed, reachable again from one bad byte. A counter that does not
        //   parse now starts from a clock-derived base, outside the small ids
        //   an earlier install handed out, and the counter is read+written
        //   under one lock (two reminders added together used to read the
        //   same number).
        //   (4) ReminderReceiver still rolled a repeating reminder forward
        //   with `while (next <= now) next += repeatMs` - the last copy of the
        //   loop v9.33.89 removed from the watchdog and the boot re-arm, where
        //   a tiny or corrupt interval is a hang on the thread that has just
        //   fired the alarm (and a hang there also swallows the notification).
        //   One step through NcieDeadlines.nextFire, same answer.
        // v9.33.97 "A cached answer belongs to the settings that produced it":
        //   the cached-answer key was built by hand in three places and they
        //   disagreed. The delete lowercased with the DEVICE locale while the
        //   read used Locale.ROOT, so on a Turkish/Azeri-locale phone the two
        //   keys differed - the cache still hit, and the delete v9.13.0 added
        //   so a rejected answer could never replay removed nothing at all.
        //   The key also ignored the answer-length setting, so turning the
        //   reply length up and asking the same question again served the old
        //   SHORT answer out of the cache instead of generating the longer
        //   one: the setting looked broken. One rule now (NcieCache.qaKey:
        //   question in Locale.ROOT + model label + generation length) for the
        //   read, the write's owner and the delete, pinned by unit tests.
        // v9.33.98 "One way to write a file, part 2: the fallback": v9.33.90 gave
        //   the app one atomic save (NcieFiles.write) and converted the files it
        //   listed, but eleven hand-rolled copies kept the OLD fallback body:
        //   `if (!tmp.renameTo(f)) { f.delete(); tmp.renameTo(f) }`. When the
        //   second rename also fails - the very case the fallback exists for -
        //   the old file is already deleted and the new one is not in place, so
        //   the store is simply empty. On the files that carried it that meant
        //   the exam list, the user's notes, the flashcard deck, the scheduled
        //   texts, the fetch log, the notification log, the offline wiki and the
        //   planner could all go blank after one failed rename. All eleven go
        //   through NcieFiles.write now, which never removes the old file until
        //   the new one is really in place and falls back to a direct write. The
        //   wiki's article rewrite also REPORTS the failure instead of ignoring
        //   it, and NcieEmbed no longer deletes a good embedding index in its
        //   catch block (tmp+rename leaves the old index intact; the delete threw
        //   away a complete index - a full re-index of every document - for
        //   nothing). A source-tree scan in verify_patches fails the build if any
        //   `delete()` ever precedes a `renameTo(` again.
        // v9.33.99 "One buffer per file": NcieFiles.write writes a FIXED sibling
        //   name (`<name>.tmp`), so two threads saving the same file at the same
        //   moment were writing into the same buffer - writeText is a buffered
        //   stream, so their bytes interleave and the file renamed into place is
        //   neither writer's text. Every reader parses these files defensively,
        //   so the symptom is not a crash: it is a silent reset of whatever that
        //   file held. Nothing serialized the callers (NcieCache.put and several
        //   state saves run on whichever thread got there first). One lock per
        //   destination path now: different files still save in parallel, the same
        //   file waits. Pinned by a 4-thread stress test in NcieFilesTest.
        // v9.33.100 "The conversation store joins the one atomic save":
        //   ChatStore.save was the last store in the app still hand-rolling its
        //   own write - a fixed `<id>.tmp`, a bare writeText, and a fallback
        //   that dropped the temp and wrote the target directly. It is also the
        //   most-written state file NOVA owns: MainActivity saves a chat on the
        //   UI thread while a Dispatchers.IO coroutine saves the same chat
        //   mid-stream, so v9.33.99's shared-buffer race was live here, on the
        //   one store whose corruption costs the user their conversation. It
        //   goes through NcieFiles.write now: one lock per destination path, the
        //   temp is never dropped before the new text is really in place, and no
        //   `<id>.tmp` is left behind for the chat list to trip over.
        // v9.33.101 "One bad row no longer costs the list": every state loader in
        //   the app read its rows with `getJSONObject(i)` and its fields with
        //   `getString(...)`, both of which THROW on a row that is not shaped as
        //   expected - and every one of those loaders sits inside a try whose
        //   catch returns an empty list. So one damaged row did not cost one
        //   row: it cost the whole conversation, the whole flashcard deck, the
        //   whole exam list, the weak-topic list, the doubt journal, the notes
        //   index and the document listing - and because add()/save() write the
        //   loaded list straight back, the next edit made the loss permanent.
        //   Every loader reads rows with `optJSONObject(i) ?: continue` and
        //   fields with `optString` now, and skips only the row that is broken.
        //   verify_patches fails the build if a state loader grows a throwing
        //   row read again.
        // v9.33.102 "The embedding index knows what it was built from": a
        //   source's semantic index was rebuilt only when its chunk COUNT
        //   changed. Count is not identity - editing a note into the same number
        //   of chunks, re-saving a document with a corrected sentence, or taking
        //   one document out and putting another of equal size in all keep the
        //   count while changing every chunk after the edit. The index was then
        //   never rebuilt, so every later question was scored against the OLD
        //   text's vectors while the scores were read as if they belonged to the
        //   new chunks: the wrong passage scored high, the passage that actually
        //   answered scored low, and the answer NOVA grounded and cited was built
        //   from material the user had already replaced - for as long as the
        //   count happened to match. The index now records a 64-bit FNV-1a
        //   fingerprint of the exact chunk list it was built from (a .sig beside
        //   the .emb) and is rebuilt on any difference at all; a missing or
        //   unreadable fingerprint fails closed to a rebuild, never to a wrong
        //   citation. Pinned by NcieFingerprintTest.
        // v9.33.103 "One way to write a file, part 3: the last bare writes":
        //   v9.33.90 gave the app one atomic save and v9.33.98 converted the
        //   hand-rolled copies, but ten files still wrote their state with a
        //   bare `writeText` - which truncates first and writes second, so a kill
        //   in between leaves a half file that every reader parses defensively
        //   and therefore silently resets. They were the cached document summary
        //   and its section checkpoint, the voice-input language, the last crash
        //   report, the app-lock PIN hash, the notification pause flag, the
        //   reminder id counter, the offline wiki's article count and the nightly
        //   report. The PIN one also used to report "App lock on" whether or not
        //   the hash reached the disk. All ten go through NcieFiles.write now, and
        //   verify_patches scans the whole source tree and fails the build if a
        //   bare `writeText` appears anywhere outside NcieFiles itself - the
        //   invariant has no exceptions left to remember.
        // v9.33.104 "A patched APK is only installed if it is a NOVA build":
        //   the delta patch is an arbitrary file the user picked, NcieDelta turns
        //   it into an APK, and the app handed that APK straight to the installer
        //   without ever asking whether it was a NOVA build. A patch built against
        //   anything else produced a file the installer rejects with a generic
        //   error - or, if NOVA had been uninstalled first, a stranger's APK
        //   wearing the NOVA name. The built APK must now carry the SAME signing
        //   certificate as the NOVA that is running, read from the installed app
        //   at runtime rather than hardcoded, so no secret lives in the source and
        //   a rotated key cannot silently disable the check. It fails closed - an
        //   unreadable APK or a missing signer is "not a NOVA build" - and the
        //   dialog points at the full APK, which always installs.
        // v9.33.105 "A cached summary belongs to the text it summarises": the
        //   document-summary cache was keyed on the document's NAME and LENGTH,
        //   and the notes-summary cache on the TOTAL LENGTH of the chunks picked
        //   for the question. Length is not identity, and it is the one thing two
        //   different texts of similar shape share: a corrected re-import of the
        //   same chapter, or two different topics whose chunks add up to the same
        //   number, both hit an entry that describes OTHER text - served instantly
        //   and labelled "cached", which is exactly what makes it believable. The
        //   keys are content fingerprints now (NcieFingerprint, v9.33.102), so any
        //   edit at all regenerates and only a true repeat is free. One-off cost:
        //   the first summary of each document after the update regenerates.
        versionCode 297
        versionName '9.33.129'
        // v6.0.0: arm64 only by default. CI also builds a universal APK
        // (arm64 + x86_64, for emulators/Chromebooks) with:
        //   gradle assembleRelease -PNOVA_ABIS=arm64-v8a,x86_64
        ndk {
            def novaAbis = ((project.findProperty('NOVA_ABIS') ?: 'arm64-v8a').toString().split(',') as List)
            abiFilters(*novaAbis)
        }
    }

    // v7.6.1: the old keystore + password were committed in plain text, so the
    // signing key is rotated. The new password lives ONLY in the GitHub Actions
    // secret NOVA_KEYSTORE_PASSWORD. Local release builds must export it first:
    //   NOVA_KEYSTORE_PASSWORD=... gradle assembleRelease
    // Without it, release builds fall back to the debug key (used by the CI
    // emulator smoke test, which does not need the real key).
    signingConfigs {
        release {
            if (System.getenv('NOVA_KEYSTORE_PASSWORD')) {
                storeFile rootProject.file('nova-release-v2.keystore')
                storePassword System.getenv('NOVA_KEYSTORE_PASSWORD')
                keyAlias 'nova'
                keyPassword System.getenv('NOVA_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // v9.33.58 (improvement pass): R8 shrinking + obfuscation, with
            // resource shrinking. The keep rules in proguard-rules.pro cover
            // the reflective surfaces (PDFBox, Prism4j/Markwon, ONNX Runtime,
            // ML Kit, the llama AAR, the manifest components).
            // IMPORTANT: smoke-test on a device before shipping - if anything
            // breaks, add `-dontobfuscate` to proguard-rules.pro to isolate it.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            signingConfig System.getenv('NOVA_KEYSTORE_PASSWORD') ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // v9.33.14: real unit tests for the pure-JVM NCIE kernel
    // (android/app/src/test/java). Run: gradle testDebugUnitTest
    testImplementation 'junit:junit:4.13.2'

    // llama.cpp Android binding (com.arm.aichat) - v5.7.0: speculative decoding
    implementation files('libs/llama-release.aar')

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.13.1'
    // v9.29.3: tool recipes read a folder the user grants via SAF.
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'io.noties.markwon:core:4.6.2'
    // v9.29.1: the LaTeX plugin needs the inline parser to render $$...$$
    // inline (it is off by default) - without it the model's single-dollar
    // formulas showed up as raw LaTeX text.
    implementation 'io.noties.markwon:inline-parser:4.6.2'
    implementation 'io.noties.markwon:syntax-highlight:4.6.2'
    implementation 'io.noties:prism4j:2.0.0'
    // v6.1.0: textbook math rendering
    implementation 'io.noties.markwon:ext-latex:4.6.2'
    implementation 'ru.noties:jlatexmath-android:0.2.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    // on-device OCR for scanned PDFs and the v9.8.0 "scan my notes"
    // photo import (bundled model - fully offline, no Play Services needed)
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // v9.7.0 "Delta Updates": bzip2 decompression for the bsdiff40
    // delta patches NcieDelta applies on device (pure Java, only its
    // bzip2 compressor classes are used)
    implementation 'org.apache.commons:commons-compress:1.27.1'

    // v9.9.0 "Semantic RAG": ONNX Runtime for the on-device
    // all-MiniLM-L6-v2 int8 embedder (fully local inference, no network)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.18.0'

    // v9.15.0 "Camera": CameraX (all local, no accounts/cloud) + activity
    // (ComponentActivity is a LifecycleOwner, which CameraX needs)
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
}

configurations.all {
    exclude group: 'org.jetbrains', module: 'annotations-java5'
}
